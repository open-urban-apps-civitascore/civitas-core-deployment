---
environments:
  default:
    values:
      - ../../environments/default/*.yaml
      - ../../environments/default/components/*.yaml.gotmpl
  testing:
    values:
      - ../../environments/default/*.yaml
      - ../../environments/default/components/*.yaml.gotmpl
      - ../../environments/testing/*.yaml.gotmpl
      - ../../environments/testing/components/*.yaml.gotmpl
    missingFileHandler: Warn
  production:
    values:
      - environments/default/*.yaml
      - environments/production/*.yaml
