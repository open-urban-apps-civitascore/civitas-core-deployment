---
global:
  domain: civitas.test
  instanceSlug: dev
  profile: development
  createNamespaces: true
  singleNamespace: true
  serviceMesh:
    enable: true
    type: linkerd
    patchNamespaces: true
  ingress:
    enabled: true
    clusterIssuer: 'selfsigned-ca'
    ingressClass: 'nginx'
  storage:
    storageClass:
      rwo: ''
      rwx: ''
      loc: ''
  metrics:
    enabled: false
components:
  - prepare
  - secrets
  - postgres
  - etcd
  - kafka
  - keycloak
  - apisix
  - apicurio
  - model-atlas
  - redpanda-connect
  - portal
  - config-adapters
