---
global:
  domain: civitas.test
  instanceSlug: dev
  profile: development
  createNamespaces: true
  singleNamespace: true
  ingress:
    enabled: true
    clusterIssuer: 'selfsigned-ca'
    ingressClass: 'nginx'
  storage:
    storageClass:
      rwo: ''
      rwx: ''
      loc: ''
  metrics:
    enabled: false
components:
  - secrets
  - postgres
  - kafka
  - keycloak
  - apicurio
  - model-atlas
