---
global:
  # The DNS domain for all services
  # e.g. this would build the keycloak domain: idm.civitas.test
  domain: civitas.test

  # Unique identifier for this deployment instance (used as namespace and keycloak realm)
  instanceSlug: dev

  # Email of the initial user with admin rights
  initialUserEmail: admin@civitas.test

  # Deployment profile: "development" or "production"
  # Controls resource limits, replica counts, scaling
  profile: development

  # Whether Helmfile should create the namespaces automatically
  createNamespaces: true

  # Namespace strategy:
  #   true  = all components in a single namespace (e.g. "dev")
  #   false = each component in its own namespace (e.g. "dev-postgres", "dev-keycloak")
  singleNamespace: true

  # Service mesh configuration
  serviceMesh:
    enable: true
    type: linkerd
    # Auto-inject Linkerd sidecars into namespaces
    patchNamespaces: true
    # mTLS enforcement level, applied as the namespace's Linkerd
    # `config.linkerd.io/default-inbound-policy` annotation:
    #   all-unauthenticated   - opportunistic mTLS (Linkerd default): meshed-to-meshed
    #                           traffic is encrypted, but plaintext/unmeshed inbound is
    #                           still accepted.
    #   cluster-authenticated - mandatory mTLS: only authenticated, meshed clients from
    #                           within this cluster may connect (recommended).
    #   all-authenticated     - mandatory mTLS from any valid mesh identity.
    #   audit                 - log-only; reports what *would* be denied without enforcing
    #                           (use as a safe rollout step before switching to enforce).
    # Kubelet liveness/readiness probes are auto-authorized by Linkerd regardless of this
    # setting. Genuinely public/unmeshed edges (the APISIX data plane behind nginx-ingress)
    # are carved out explicitly via Linkerd `Server` policies, so mandatory mTLS does not
    # break ingress.
    defaultInboundPolicy: cluster-authenticated
    # Whether the cluster's nginx ingress controller may reach the APISIX data
    # plane WITHOUT mTLS. This drives the `accessPolicy` of the APISIX `Server`:
    #   true  - ingress is unmeshed; the data-plane edge is `all-unauthenticated`
    #           so plaintext ingress traffic is accepted (default).
    #   false - the ingress controller is meshed; ingress->APISIX is mTLS, so the
    #           data-plane edge is `all-authenticated` and rejects plaintext.
    allowUnauthenticatedIngress: true

  ingress:
    # Use your available cluster issuer for production, e.g. 'letsencrypt-prod'
    clusterIssuer: 'selfsigned-ca'
    ingressClass: 'nginx'

  # Storage class mappings (leave empty to use cluster defaults)
  storage:
    storageClass:
      # ReadWriteOnce (databases)
      rwo: ''
      # ReadWriteMany (shared volumes, currently not used)
      rwx: ''
      # Local storage
      loc: ''

  # Prometheus metrics scraping
  metrics:
    enabled: false

# List of components to deploy (order matters for dependencies)
# To "disable" a component, remove it from the list.
# To add custom components/addons, add them to the list.
# This is not under the "global" key, but its own root key!
components:
  - prepare
  - secrets
  - networkpolicies
  - postgres
  - etcd
  - kafka
  - keycloak
  - authz
  - apisix
  - frost
  - nifi
  - config-adapters
  - portal
  - geoserver
  - valkey
  - superset
