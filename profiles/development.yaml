---
defaults:
  replicas: 1
  resources:
    requests:
      cpu: 1
      memory: '200Mi'
    limits:
      cpu: 1
      memory: '1Gi'
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
