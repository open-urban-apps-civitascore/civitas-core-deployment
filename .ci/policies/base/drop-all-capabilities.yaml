---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.8.0
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/scored: 'true'
    policies.kyverno.io/description: >-
      Linux capabilities grant processes elevated privileges without full root access and
      are a common attack surface. All capabilities must be explicitly dropped on every
      container (including init and ephemeral containers), with only the minimum required
      capabilities added back individually. This policy checks that every container in a
      Pod sets `securityContext.capabilities.drop` to include `ALL` (case-insensitive).
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: >-
          Containers must drop `ALL` capabilities.
        foreach:
          - list: request.object.spec.[ephemeralContainers, initContainers, containers][]
            deny:
              conditions:
                all:
                  - key: ALL
                    operator: AnyNotIn
                    value: '{{ element.securityContext.capabilities.drop[].to_upper(@) || `[]` }}'
