---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.8.0
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/scored: 'true'
    policies.kyverno.io/description: >-
      A read-only root filesystem enforces an immutable container strategy: the container
      may only write to explicitly mounted volumes. This prevents accidental or malicious
      modifications to the container filesystem at runtime and limits the blast radius of
      a compromised container. This policy validates that all containers and init containers
      in a Pod set `securityContext.readOnlyRootFilesystem: true`.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-ro-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: >-
          All containers and init containers must set readOnlyRootFilesystem: true
          in their securityContext.
        foreach:
          - list: 'request.object.spec.[initContainers, containers][]'
            deny:
              conditions:
                all:
                  - key: '{{ element.securityContext.readOnlyRootFilesystem || false }}'
                    operator: Equals
                    value: false
