---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require Resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Resources requests and limits are required for production workloads to ensure
      proper scheduling and prevent resource starvation. This policy validates that
      all containers define CPU and memory requests and limits.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: 'All containers must have CPU and memory requests and limits defined.'
        foreach:
          - list: request.object.spec.[initContainers, containers][]
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ''
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ''
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ''
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ''
