---
topics:
  # Apicurio
  - name: storage-topic
    partitions: 1
    replicas: 1
    config:
      cleanup.policy: compact
  - name: global-id-topic
    partitions: 1
    replicas: 1
    config:
      cleanup.policy: compact
  - name: input-topic
    partitions: 1
    replicas: 1
    config:
      cleanup.policy: compact
  - name: logx-topic
    partitions: 1
    replicas: 1
    config:
      cleanup.policy: compact
  - name: dbx-topic
    partitions: 1
    replicas: 1
    config:
      cleanup.policy: compact

users:
  # Apicurio
  - name: apicurio
    authentication:
      type: scram-sha-512
    authorization:
      type: simple
      acls:
        - resource:
            type: topic
            name: storage-topic
            patternType: literal
          operation: Read
        - resource:
            type: topic
            name: storage-topic
            patternType: literal
          operation: Write
        - resource:
            type: topic
            name: storage-topic
            patternType: literal
          operation: Describe
        - resource:
            type: topic
            name: global-id-topic
            patternType: literal
          operation: Read
        - resource:
            type: topic
            name: global-id-topic
            patternType: literal
          operation: Write
        - resource:
            type: topic
            name: global-id-topic
            patternType: literal
          operation: Describe
        - resource:
            type: topic
            name: input-topic
            patternType: literal
          operation: Read
        - resource:
            type: topic
            name: input-topic
            patternType: literal
          operation: Write
        - resource:
            type: topic
            name: input-topic
            patternType: literal
          operation: Describe
        - resource:
            type: topic
            name: logx-topic
            patternType: literal
          operation: Read
        - resource:
            type: topic
            name: logx-topic
            patternType: literal
          operation: Write
        - resource:
            type: topic
            name: logx-topic
            patternType: literal
          operation: Describe
        - resource:
            type: topic
            name: dbx-topic
            patternType: literal
          operation: Read
        - resource:
            type: topic
            name: dbx-topic
            patternType: literal
          operation: Write
        - resource:
            type: topic
            name: dbx-topic
            patternType: literal
          operation: Describe
        - resource:
            type: group
            name: apicurio
            patternType: prefix
          operation: Read

kafka:
  config:
    transaction.state.log.replication.factor: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.min.isr: 1
    log.message.format.version: '2.7'
    inter.broker.protocol.version: '2.7'
