---
controller:
  replicas: 1
  resources:
    requests:
      cpu: '200m'
      memory: '512Mi'
    limits:
      cpu: '1'
      memory: '1Gi'

broker:
  replicas: 1
  resources:
    requests:
      cpu: '200m'
      memory: '512Mi'
    limits:
      cpu: '1'
      memory: '1Gi'

kafka:
  # Listener presets; adjust as needed
  listeners:
    - name: internal
      port: 9092
      type: internal
      tls: false
