---
# Development profile for etcd
# Optimized for local/dev environments with minimal resources

# Single replica for development
replicas: 1

# Minimal resource allocation for development
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Persistent storage - small size for dev
persistence:
  enabled: true
  size: 1Gi
  storageClass: ''
  accessMode: ReadWriteOnce

# Pod disruption budget - disabled for single replica
podDisruptionBudget:
  enabled: false

# Reduced quotas for development
etcd:
  quotaBackendBytes: '2147483648' # 2GB for dev
