# Production-specific configuration for Kafka UI

# Ingress disabled in production (keep it internal)
ingress:
  enabled: false

# Higher resource requirements for prod
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1Gi

# Multiple replicas for high availability
replicaCount: 2

# Pod disruption budget for production
podDisruptionBudget:
  enabled: true
  minAvailable: 1
