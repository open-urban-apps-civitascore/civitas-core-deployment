deployment:
  replicas: 2

resources:
  requests:
    cpu: '200m'
    memory: '512Mi'
  limits:
    cpu: '2'
    memory: '2Gi'

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
