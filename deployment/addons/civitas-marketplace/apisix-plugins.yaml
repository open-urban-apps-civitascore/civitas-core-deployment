---
# Plugin config for the marketplace route — every route references a
# plugin_config of the same name, so this file is mandatory alongside
# apisix-routes.yaml. Mirrors portal-bff: the app handles auth itself
# (NextAuth), the gateway only adds header hygiene and forwarded-proto.
marketplace:
  name: marketplace
  description: 'Open Urban Apps marketplace for reusable use cases'
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            ngx.req.clear_header("X-Userinfo")
            ngx.req.clear_header("X-Access-Token")
            ngx.req.clear_header("X-Allowed-Scope-Ids")
          end
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
