{{- range $cm := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fullname" $ }}-{{ $cm.name }}
  labels:
    {{- include "labels" $ | nindent 4 }}
data:
  {{- range $fileName, $content := $cm.data }}
  {{ $fileName }}: |-
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
