{{- if and .Values.registry.enabled .Values.registry.app.ingress.enabled .Values.registry.app.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "apicurio.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.registry.app.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.registry.app.ingress.ingressClassName }}
  ingressClassName: {{ .Values.registry.app.ingress.ingressClassName }}
  {{- end }}
  rules:
  - host: {{ .Values.registry.app.ingress.host }}
    http:
      paths:
      - path: {{ .Values.registry.app.ingress.path | default "/" }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "apicurio.fullname" . }}-app
            port:
              name: http
  {{- if .Values.registry.app.ingress.tls }}
  tls:
    {{- toYaml .Values.registry.app.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
