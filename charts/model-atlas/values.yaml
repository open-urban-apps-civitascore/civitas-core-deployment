#  timeoutSeconds: 3
#  failureThreshold: 3
#
#startupProbe:
#  httpGet:
#    path: /actuator/health/readiness
#    port: http
#  initialDelaySeconds: 10
#  periodSeconds: 10
#  timeoutSeconds: 3
#  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: tmp
    emptyDir: {}

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}
