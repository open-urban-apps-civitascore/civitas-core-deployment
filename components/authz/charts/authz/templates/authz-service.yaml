---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authz.fullname" . }}-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authz.authz.labels" . | nindent 4 }}
  {{- with .Values.authz.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.authz.service.type | default "ClusterIP" }}
  {{- with .Values.authz.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with .Values.authz.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.authz.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.authz.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  ports:
  - port: {{ .Values.authz.service.port | default 8091 }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "authz.authz.selectorLabels" . | nindent 4 }}
