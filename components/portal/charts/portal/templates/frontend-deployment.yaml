{{- if .Values.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal.fullname" . }}-frontend
  labels:
    {{- include "portal.frontend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.frontend.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "portal.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portal.frontend.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Port configuration
            - name: PORT
              value: "3000"
            # NextAuth configuration
            - name: NEXTAUTH_URL
              value: {{ .Values.nextAuth.url }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"  # TODO: Remove and mount self-signed certificates properly
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-nextauth-secret
                  key: secret
            # Keycloak configuration
            - name: KEYCLOAK_CLIENT_ID
              value: portal-frontend
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-keycloak-secrets
                  key: client-secret
            - name: KEYCLOAK_ISSUER
              value: "{{ .Values.keycloak.authServerUrl }}/realms/{{ .Values.keycloak.realm }}"
            # TODO: Remove these temporary backend service URL configurations
            # These are temporary and should be removed once the frontend is updated
            # to use proper API gateway routing instead of direct backend service calls
            - name: JSON_SERVER_HOST
              value: "http://{{ include "portal.backend.serviceName" . }}"
            - name: JSON_SERVER_PORT
              value: "8080"
            - name: NEXT_PUBLIC_JSON_SERVER_HOST
              value: "http://{{ include "portal.backend.serviceName" . }}"
            - name: NEXT_PUBLIC_JSON_SERVER_PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
{{- end }}
