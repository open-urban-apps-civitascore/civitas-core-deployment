{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "portal.fullname" . }}-frontend
  labels:
    {{- include "portal.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "portal.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "portal.fullname" . }}-backend
  labels:
    {{- include "portal.backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "portal.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
{{- end }}
