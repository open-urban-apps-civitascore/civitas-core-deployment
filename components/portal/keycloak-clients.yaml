---
portal-frontend:
  name: Portal Frontend
  description: CIVITAS Portal Frontend Application
  subdomain: portal
  redirectPath: /api/auth/callback/keycloak
  additionalRedirectPaths:
    - /
  rawValues:
    protocolMappers:
      # Without this, APISIX's openid-connect introspection (client
      # apisix-validator) rejects portal-frontend tokens with
      # "Client 'apisix-validator' is not in the token audience".
      - name: apisix-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: apisix-validator
          access.token.claim: 'true'
          id.token.claim: 'false'
