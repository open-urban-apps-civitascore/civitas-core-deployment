---
portal-backend:
  name: portal-backend
  description: API for the Civitas Portal
  plugins:
    openid-connect:
      client_id: portal-frontend
      client_secret: WEeoKGbjQ0FJqVgYf4YNeE7og8HFuypB
      discovery: http://keycloak-app-keycloakx-http.staging.svc.cluster.local:80/realms/staging/.well-known/openid-configuration
      bearer_only: true
      ssl_verify: false
      set_userinfo_header: true
      introspection_endpoint: http://keycloak-app-keycloakx-http.staging.svc.cluster.local:80/realms/staging/protocol/openid-connect/token/introspect
      introspection_endpoint_auth_method: post
    opa:
      host: http://authz-authz-opa:8181
      policy: civitas/authz/decision
      with_route: true
      with_service: true
      with_consumer: false
      send_headers_upstream:
        - X-Allowed-Scope-Ids
    proxy-rewrite:
      headers:
        remove:
          - X-Allowed-Scope-Ids
    request-id:
      include_in_response: true
portal-bff:
  name: portal-bff
  description: Backend-for-Frontend for the Civitas Portal
  plugins:
    request-id:
      include_in_response: true
    proxy-rewrite:
      headers:
        X-Forwarded-Proto: https
        X-Forwarded-Port: '443'
