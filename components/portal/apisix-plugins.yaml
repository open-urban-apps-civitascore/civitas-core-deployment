---
portalBE:
  name: Portal Backend
  description: API for the Civitas Portal
  plugins:
    openid-connect:
      client_id: apisix-validator
      client_secret: unused-for-jwks-validation
      discovery: https://idm.staging.dev.civitas2.fw-web.space/realms/staging/.well-known/openid-configuration
      bearer_only: true
      use_jwks: true
      ssl_verify: false
      set_userinfo_header: true
    opa:
      host: http://authz-authz-opa:8181
      policy: civitas/authz/decision
      with_route: true
      with_service: true
      with_consumer: false
      send_headers_upstream:
        - X-Allowed-Scope-Ids
    proxy-rewrite:
      headers:
        remove:
          - X-Allowed-Scope-Ids
    request-id:
      include_in_response: true
portalBFF:
  name: Portal BFF
  description: Backend-for-Frontend for the Civitas Portal
  plugins:
    request-id:
      include_in_response: true
    proxy-rewrite:
      headers:
        X-Forwarded-Proto: http
        X-Forwarded-Port: '80'
