---
portal:
  frontend:
    portal-nextauth-secret:
      secret:
        length: 32
        generate: true
  backend:
    portal-backend-crypto:
      # encoding: hex is required because CryptoKeyLoader.hexStringToBytes() expects valid hex strings
      civitas-master-key:
        length: 64
        encoding: hex
        generate: true
      civitas-master-salt:
        length: 32
        encoding: hex
        generate: true
