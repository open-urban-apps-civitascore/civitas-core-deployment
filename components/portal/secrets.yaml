---
portal:
  frontend:
    portal-nextauth-secret:
      secret:
        length: 32
        generate: true
      componentNamespaces:
        - portal
  backend:
    portal-backend-crypto:
      # encoding: hex is required because CryptoKeyLoader.hexStringToBytes() expects valid hex strings
      civitas-master-key:
        length: 64
        encoding: hex
        generate: true
      componentNamespaces:
        - portal
        - configAdapters
    db-portal:
      password:
        length: 32
        generate: true
      username: 'portal'
      componentNamespaces:
        - portal
        - postgres
