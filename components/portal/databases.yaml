---
portal:
  name: 'portal'
  embedded: true
  user: 'portal'
  secret:
    name: 'db-portal'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  additionalRoles:
    - name: 'authz'
      type: 'readonly'
      credentialsSecret:
        name: 'db-authz-readonly'
        passwordKey: 'password'
