---
etcd-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: etcd-etcd
    app.kubernetes.io/name: etcd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: etcd
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
