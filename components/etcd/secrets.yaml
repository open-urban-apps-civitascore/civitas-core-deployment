---
etcd:
  etcd:
    etcd-root-password: # name of the secret in kubernetes
      root-password: # key in the secret
        length: 16
        generate: true # indicates that this value should be generated
      componentNamespaces:
        - etcd
    etcd-apisix-password:
      apisix-password:
        length: 16
        generate: true
      componentNamespaces:
        - etcd
        - apisix
