apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nifi-bootstrap.fullname" . }}
  labels:
    {{- include "nifi-bootstrap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ join "," .Values.hook.deletePolicies | quote }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  {{- with .Values.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "nifi-bootstrap.labels" . | nindent 8 }}
    spec:
      # One-shot provisioning Job: retries are handled at the Job level via
      # `backoffLimit`, so the pod itself must never restart on its own.
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ['/bin/sh', '/scripts/bootstrap.sh']
          env:
            - name: NIFI_URL
              value: {{ printf "%s/nifi-api" (.Values.nifi.url | trimSuffix "/") | quote }}
            - name: NIFI_INSECURE_SKIP_VERIFY
              value: {{ .Values.nifi.insecureSkipVerify | quote }}
            - name: OIDC_TOKEN_URL
              value: {{ required "oidc.tokenUrl is required" .Values.oidc.tokenUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            # NiFi's Initial Admin Identity.
            - name: NIFI_ADMIN_USERNAME
              value: {{ required "oidc.adminUsername is required" .Values.oidc.adminUsername | quote }}
            - name: HUMAN_ADMIN_IDENTITY
              value: {{ .Values.identities.humanAdmin | quote }}
            - name: CONFIG_ADAPTER_IDENTITY
              value: {{ .Values.identities.configAdapter | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: oidc-secret
              mountPath: /var/run/secrets/oidc
              readOnly: true
            # /tmp scratch space for response bodies (readOnlyRootFilesystem=true)
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "nifi-bootstrap.fullname" . }}
            defaultMode: 0o555
        # Mount the admin password as a file so it never appears in the pod's `env`.
        - name: oidc-secret
          secret:
            secretName: {{ .Values.oidc.adminPasswordSecretRef.name }}
            items:
              - key: {{ .Values.oidc.adminPasswordSecretRef.key }}
                path: admin-password
        - name: tmp
          emptyDir: {}
