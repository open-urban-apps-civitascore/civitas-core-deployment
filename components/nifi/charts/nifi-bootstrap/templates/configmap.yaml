apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nifi-bootstrap.fullname" . }}
  labels:
    {{- include "nifi-bootstrap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": {{ .Values.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ join "," .Values.hook.deletePolicies | quote }}
data:
  # NiFi access-policy provisioning script.
  # Authenticates via the OAuth 2.0 client-credentials grant on the `nifi-bootstrap`
  # client — whose client id is NiFi's Initial Admin Identity — then idempotently
  # creates the human admin and `CONFIG_ADAPTER_IDENTITY` users + their policies.
  # See the "Initial admin and bootstrap" section in `components/nifi/README.md`
  # for the design rationale.

  bootstrap.sh: |
    #!/bin/sh
    set -eu

    # `--connect-timeout 5 --max-time 15` so an unreachable target fails fast
    # instead of hanging the Job past activeDeadlineSeconds.
    CURL_OPTS="-sS --fail-with-body --connect-timeout 5 --max-time 15"
    if [ "${NIFI_INSECURE_SKIP_VERIFY:-true}" = "true" ]; then
      CURL_OPTS="${CURL_OPTS} -k"
    fi

    # Logs go to stderr so helper functions can return values on stdout via
    # `$(...)` without callers filtering log lines out.
    log()     { printf '[bootstrap %s] %s\n' "$(date -u +%H:%M:%S)" "$*" 1>&2; }
    die()     { log "ERROR: $*"; exit 1; }

    # Run a curl command without `--fail-with-body` and echo only its HTTP
    # status code (000 on connection failure).
    curl_status() {
      _opts=$(printf '%s' "${CURL_OPTS}" | sed 's/--fail-with-body//')
      # shellcheck disable=SC2086
      curl ${_opts} -w '%{http_code}' "$@" 2>/dev/null || printf '000'
    }

    log "starting; NIFI_URL=${NIFI_URL} OIDC_TOKEN_URL=${OIDC_TOKEN_URL} OIDC_CLIENT_ID=${OIDC_CLIENT_ID}"
    log "identities to provision: humanAdmin='${HUMAN_ADMIN_IDENTITY:-}' configAdapter='${CONFIG_ADAPTER_IDENTITY:-}'"

    # 1) Fetch a `client_credentials`-grant token for the `nifi-bootstrap` confidential
    #    client. Logs status + body on every attempt so a misconfigured client / realm /
    #    secret surfaces immediately.
    log "Fetching client-credentials token from ${OIDC_TOKEN_URL} (client_id=${OIDC_CLIENT_ID})"
    OIDC_CLIENT_SECRET=$(cat /var/run/secrets/oidc/client-secret)
    ACCESS_TOKEN=""
    # 15 × 5s = 75s budget — Keycloak is normally ready within seconds.
    for i in $(seq 1 15); do
      HTTP_CODE=$(curl_status -o /tmp/token.json \
            -X POST "${OIDC_TOKEN_URL}" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
            --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}")
      if [ "${HTTP_CODE}" = "200" ]; then
        ACCESS_TOKEN=$(jq -r '.access_token // empty' </tmp/token.json)
        if [ -n "${ACCESS_TOKEN}" ]; then
          log "Got access token (length=${#ACCESS_TOKEN}) on attempt ${i}"
          break
        fi
        log "  attempt ${i}/15: HTTP 200 but no .access_token in response: $(cat /tmp/token.json)"
      else
        log "  attempt ${i}/15: Keycloak HTTP ${HTTP_CODE}, body: $(cat /tmp/token.json 2>/dev/null || true)"
      fi
      sleep 5
    done
    [ -n "${ACCESS_TOKEN}" ] || die "Could not obtain client-credentials access token from Keycloak after 15 attempts"

    # NiFi verifies the JWT against the realm JWKS and resolves identity from the `sub`
    # claim, which the `nifi-bootstrap` client overrides to `nifi-bootstrap` via a
    # protocol mapper (see components/nifi/keycloak-clients.yaml) — NiFi's bearer-token
    # path uses `sub` regardless of `claim_identifying_user`.
    AUTH_HEADER="Authorization: Bearer ${ACCESS_TOKEN}"

    # 2) Wait until NiFi REST API is reachable & accepts the token.
    # 401/403 means the token's identity is not the Initial Admin (stale
    # users.xml or wrong initial_admin_identity).
    log "Waiting for NiFi REST API at ${NIFI_URL}/flow/current-user"
    NIFI_READY=false
    # 24 × 5s = 120s — NiFi normally responds within ~30s of boot.
    for i in $(seq 1 24); do
      HTTP_CODE=$(curl_status -o /tmp/cu.json \
            -H "${AUTH_HEADER}" \
            "${NIFI_URL}/flow/current-user")
      case "${HTTP_CODE}" in
        200)
          log "NiFi REST API up; current-user: $(jq -c '{identity,anonymous}' </tmp/cu.json 2>/dev/null || cat /tmp/cu.json)"
          NIFI_READY=true; break ;;
        401|403)
          log "  attempt ${i}/24: NiFi rejected our token (HTTP ${HTTP_CODE}). body: $(cat /tmp/cu.json)" ;;
        500|502|503|504)
          log "  attempt ${i}/24: NiFi still warming up (HTTP ${HTTP_CODE}). body: $(head -c 200 /tmp/cu.json 2>/dev/null || true)" ;;
        000)
          log "  attempt ${i}/24: curl could not connect to NiFi" ;;
        *)
          log "  attempt ${i}/24: NiFi HTTP ${HTTP_CODE}, body: $(head -c 200 /tmp/cu.json 2>/dev/null || true)" ;;
      esac
      sleep 5
    done
    [ "${NIFI_READY}" = "true" ] || die "NiFi never became reachable / never accepted our token after 24 attempts"

    # 3) Helper functions

    # nifi_get <path> — retries 5xx (flow-controller/cluster-coordinator still
    # warming up after REST API responds). Dies on 4xx with body so the
    # response never flows into jq as garbage.
    nifi_get() {
      _path="$1"
      for _attempt in 1 2 3 4 5; do
        _code=$(curl_status -o /tmp/nifi_get.out -H "${AUTH_HEADER}" "${NIFI_URL}${_path}")
        case "${_code}" in
          2??)
            cat /tmp/nifi_get.out
            return 0 ;;
          5??|000)
            log "  GET ${_path} returned HTTP ${_code} (attempt ${_attempt}/5); retrying in 3s"
            sleep 3 ;;
          *)
            # 4xx — retrying won't help; abort instead of feeding the error body into jq.
            die "GET ${_path} returned HTTP ${_code}; body: $(head -c 400 /tmp/nifi_get.out 2>/dev/null || true)" ;;
        esac
      done
      die "GET ${_path} kept returning ${_code} after 5 attempts; body: $(head -c 400 /tmp/nifi_get.out 2>/dev/null || true)"
    }

    # nifi_write <METHOD> <path> <json> — POST/PUT with retry on transient
    # errors (404/409 during cluster-coordinator election, 5xx, connection
    # loss). Dies with status + body on any other failure.
    nifi_write() {
      _method="$1"; _path="$2"; _body="$3"
      _opts=$(printf '%s' "${CURL_OPTS}" | sed 's/--fail-with-body//')
      for _attempt in 1 2 3 4 5; do
        # shellcheck disable=SC2086
        _code=$(curl ${_opts} -o /tmp/nifi_write.out -w '%{http_code}' \
                  -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
                  -X "${_method}" "${NIFI_URL}${_path}" -d "${_body}" \
                2>/dev/null || printf '000')
        case "${_code}" in
          2??)
            cat /tmp/nifi_write.out
            return 0 ;;
          404|409|5??|000)
            log "  ${_method} ${_path} returned HTTP ${_code} (attempt ${_attempt}/5); retrying in 3s"
            sleep 3 ;;
          *)
            die "${_method} ${_path} returned HTTP ${_code}; body: $(head -c 400 /tmp/nifi_write.out 2>/dev/null || true)" ;;
        esac
      done
      die "${_method} ${_path} kept returning ${_code} after 5 attempts; body: $(head -c 400 /tmp/nifi_write.out 2>/dev/null || true)"
    }

    # nifi_post <path> <json>
    nifi_post() { nifi_write POST "$1" "$2"; }
    # nifi_put <path> <json>
    nifi_put()  { nifi_write PUT  "$1" "$2"; }


    # Find a tenant (user) by identity. Echoes the user id or empty string.
    find_user_id() {
      identity="$1"
      nifi_get '/tenants/users' | \
        jq -r --arg id "${identity}" '.users[] | select(.component.identity == $id) | .id' \
        | head -n1
    }

    # Create a user with the given identity; idempotent. Echoes the user id.
    ensure_user() {
      identity="$1"
      existing=$(find_user_id "${identity}")
      if [ -n "${existing}" ]; then
        log "  user already exists: ${identity} (${existing})"
        echo "${existing}"; return 0
      fi
      log "  creating user: ${identity}"
      body=$(jq -n --arg id "${identity}" '{revision:{version:0},component:{identity:$id}}')
      resp=$(nifi_post '/tenants/users' "${body}")
      printf '%s' "${resp}" | jq -r '.id'
    }

    # Find an access policy by resource + action. Echoes the policy entity if
    # found, else empty. The convenience endpoint returns 409 when duplicates
    # exist on disk (from earlier failed runs); in that case we fall back to
    # listing all policies and returning the first match.
    find_policy() {
      resource="$1"; action="$2"
      http_code=$(curl_status -o /tmp/policy.json \
        -H "${AUTH_HEADER}" "${NIFI_URL}/policies/${action}${resource}")
      case "${http_code}" in
        200)
          cat /tmp/policy.json
          return 0 ;;
        404)
          return 0 ;;
        409)
          log "  find_policy: duplicates detected for ${action} ${resource} (HTTP 409); falling back to /policies list"
          ;;
        *)
          log "  find_policy: ${action} ${resource} unexpected HTTP ${http_code}; treating as missing"
          return 0 ;;
      esac

      list_code=$(curl_status -o /tmp/policies.json \
        -H "${AUTH_HEADER}" "${NIFI_URL}/policies")
      if [ "${list_code}" != "200" ]; then
        log "  find_policy: /policies list returned HTTP ${list_code}; treating ${action} ${resource} as missing"
        return 0
      fi
      jq --arg res "${resource}" --arg act "${action}" \
        '.policies[] | select(.component.resource == $res and .component.action == $act)' \
        </tmp/policies.json | jq -s '.[0] // empty'
    }


    # POST /policies is NON-IDEMPOTENT: a retry after a lost response creates
    # a duplicate. So on 409/000 we return 1 (caller falls back to
    # find_policy + PUT) instead of retrying the POST.
    create_policy_or_attach() {
      _resource="$1"; _action="$2"; _user_id="$3"; _user_identity="$4"
      _body=$(jq -n \
        --arg res "${_resource}" \
        --arg act "${_action}" \
        --arg uid "${_user_id}" \
        --arg uident "${_user_identity}" \
        '{revision:{version:0},component:{resource:$res,action:$act,
           users:[{id:$uid,component:{identity:$uident}}],
           userGroups:[]}}')

      _opts=$(printf '%s' "${CURL_OPTS}" | sed 's/--fail-with-body//')
      # shellcheck disable=SC2086
      _code=$(curl ${_opts} -o /tmp/policy_create.out -w '%{http_code}' \
                -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
                -X POST "${NIFI_URL}/policies" -d "${_body}" \
              2>/dev/null || printf '000')
      case "${_code}" in
        2??)
          cat /tmp/policy_create.out
          return 0 ;;
        409)
          log "  POST /policies for ${_action} ${_resource} returned 409 (exists or duplicates); falling back to find + attach"
          return 1 ;;
        000)
          # Don't retry — the server may have created the policy and a retry would duplicate it.
          log "  POST /policies for ${_action} ${_resource} got HTTP 000 (connection lost); will probe with find_policy"
          return 1 ;;
        *)
          die "POST /policies for ${_action} ${_resource} returned HTTP ${_code}; body: $(head -c 400 /tmp/policy_create.out 2>/dev/null || true)" ;;
      esac
    }

    # Ensure a policy exists and the given user is a member. Loops up to 3
    # times so that a POST-then-409 falls through to find-then-PUT in one call.
    ensure_policy() {
      resource="$1"; action="$2"; user_id="$3"; user_identity="$4"
      for _iter in 1 2 3; do
        existing=$(find_policy "${resource}" "${action}")
        if [ -n "${existing}" ]; then
          policy_id=$(printf '%s' "${existing}" | jq -r '.id')
          already_member=$(printf '%s' "${existing}" \
            | jq --arg uid "${user_id}" '[.component.users[]? | select(.id == $uid)] | length')
          if [ "${already_member}" -gt 0 ]; then
            log "  policy ${action} ${resource} already grants ${user_identity}"
            return 0
          fi
          log "  adding ${user_identity} to existing policy ${action} ${resource}"
          updated=$(printf '%s' "${existing}" | jq \
            --arg uid "${user_id}" \
            --arg uident "${user_identity}" \
            '.component.users += [{id:$uid,component:{identity:$uident}}]')
          nifi_put "/policies/${policy_id}" "${updated}" >/dev/null
          return 0
        fi

        # No policy yet — try to create; on 409/000 loop back to find_policy.
        log "  creating policy ${action} ${resource} for ${user_identity}"
        if create_policy_or_attach "${resource}" "${action}" "${user_id}" "${user_identity}" >/dev/null; then
          return 0
        fi
      done
      die "ensure_policy ${action} ${resource}: gave up after 3 find-then-create iterations"
    }


    # 4) Resolve the root process group id.
    # Use `/flow/process-groups/root` (gated by `/flow:read`, which the Initial
    # Admin has) rather than `/process-groups/root` (gated by the component-
    # scoped policy that doesn't exist yet at first boot).
    ROOT_PG_ID=$(nifi_get '/flow/process-groups/root' | jq -r '.processGroupFlow.id // .id')
    [ -n "${ROOT_PG_ID}" ] && [ "${ROOT_PG_ID}" != "null" ] || die "Could not resolve root PG id"
    log "Root process group id: ${ROOT_PG_ID}"


    # 5) Policy sets. Space-separated `resource:action` pairs. GLOBAL_* covers
    # top-level NiFi resources; COMPONENT_* covers resources scoped to root PG.

    # Full admin: human operator.
    GLOBAL_POLICIES_ADMIN="
      /flow:read
      /controller:read /controller:write
      /parameter-contexts:read /parameter-contexts:write
      /provenance:read
      /restricted-components:read /restricted-components:write
      /policies:read /policies:write
      /tenants:read /tenants:write
      /site-to-site:read
      /system:read
      /counters:read /counters:write
      /proxy:read /proxy:write
    "
    COMPONENT_POLICIES_ADMIN="
      /process-groups/${ROOT_PG_ID}:read
      /process-groups/${ROOT_PG_ID}:write
      /data/process-groups/${ROOT_PG_ID}:read
      /data/process-groups/${ROOT_PG_ID}:write
      /provenance-data/process-groups/${ROOT_PG_ID}:read
      /operation/process-groups/${ROOT_PG_ID}:write
    "

    # config-adapter: REST API client. Full "flow author" surface (controller,
    # parameter contexts, provenance, root-PG R/W/operate) but no /tenants,
    # /policies, /system, /counters, /site-to-site — so it cannot escalate to
    # NiFi admin.
    GLOBAL_POLICIES_ADAPTER="
      /flow:read
      /controller:read /controller:write
      /parameter-contexts:read /parameter-contexts:write
      /provenance:read
      /restricted-components:read /restricted-components:write
      /proxy:read /proxy:write
    "
    COMPONENT_POLICIES_ADAPTER="
      /process-groups/${ROOT_PG_ID}:read
      /process-groups/${ROOT_PG_ID}:write
      /data/process-groups/${ROOT_PG_ID}:read
      /data/process-groups/${ROOT_PG_ID}:write
      /provenance-data/process-groups/${ROOT_PG_ID}:read
      /operation/process-groups/${ROOT_PG_ID}:write
    "

    apply_policies() {
      identity="$1"; user_id="$2"; policies="$3"
      for entry in ${policies}; do
        resource="${entry%:*}"
        action="${entry##*:}"
        ensure_policy "${resource}" "${action}" "${user_id}" "${identity}"
      done
    }

    # 6) Provision the human admin.
    if [ -n "${HUMAN_ADMIN_IDENTITY:-}" ]; then
      log "=== Provisioning human admin: ${HUMAN_ADMIN_IDENTITY} ==="
      ADMIN_ID=$(ensure_user "${HUMAN_ADMIN_IDENTITY}")
      apply_policies "${HUMAN_ADMIN_IDENTITY}" "${ADMIN_ID}" "${GLOBAL_POLICIES_ADMIN}"
      apply_policies "${HUMAN_ADMIN_IDENTITY}" "${ADMIN_ID}" "${COMPONENT_POLICIES_ADMIN}"
    else
      log "HUMAN_ADMIN_IDENTITY is empty — skipping human admin provisioning"
    fi

    # 7) Provision the config-adapter identity.
    if [ -n "${CONFIG_ADAPTER_IDENTITY:-}" ]; then
      log "=== Provisioning config-adapter: ${CONFIG_ADAPTER_IDENTITY} ==="
      ADAPTER_ID=$(ensure_user "${CONFIG_ADAPTER_IDENTITY}")
      apply_policies "${CONFIG_ADAPTER_IDENTITY}" "${ADAPTER_ID}" "${GLOBAL_POLICIES_ADAPTER}"
      apply_policies "${CONFIG_ADAPTER_IDENTITY}" "${ADAPTER_ID}" "${COMPONENT_POLICIES_ADAPTER}"
    else
      log "CONFIG_ADAPTER_IDENTITY is empty — skipping config-adapter provisioning"
    fi

    log "Bootstrap complete."
