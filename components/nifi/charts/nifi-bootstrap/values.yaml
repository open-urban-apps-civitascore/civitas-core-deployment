---
nameOverride: ''
fullnameOverride: ''

nifi:
  url: https://nifi-nifi-0.nifi-nifi.nifi:8443
  # If true, the Job will use `curl -k` (no cert verification). Acceptable while NiFi
  # serves a self-signed cert;
  insecureSkipVerify: true

oidc:
  # Full token URL (`<issuer>/protocol/openid-connect/token`).
  tokenUrl: ''
  clientId: nifi-direct
  # Realm user the Job authenticates as.
  adminUsername: nifi-admin@internal.local
  # Kubernetes Secret holding the admin user's password.
  adminPasswordSecretRef:
    name: nifi-admin-keycloak-user
    key: password

# Identities the Job will provision policies for inside NiFi.
identities:
  humanAdmin: ''
  configAdapter: nifi-config-adapter@internal.local

image:
  # Lightweight, well-known image with curl + jq for the bootstrap script.
  repository: alpine/curl
  tag: '8.10.1'
  digest: ''
  pullPolicy: IfNotPresent

hook:
  weight: '10'
  deletePolicies:
    - before-hook-creation

backoffLimit: 5
activeDeadlineSeconds: ~
tlSecondsAfterFinished: ~

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

linkerd:
  enable: false
  # Selects the NiFi pods (matches the upstream chart's StatefulSet template).
  podSelector:
    app.kubernetes.io/instance: nifi-nifi
  opaquePorts:
    - port: 8443 # HTTPS UI / REST API
    - port: 11443 # cluster protocol RPC (TLS)
    - port: 10443 # cluster load-balancer protocol (TLS)
    - port: 6342 # site-to-site (TLS)
    - port: 9092 # Prometheus scrape (TLS)
