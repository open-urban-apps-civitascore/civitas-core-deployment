---
# NiFi handles its own OIDC; clear shared OAuth headers so they don't leak in from APISIX's
# global openid-connect plugin context. Do NOT inject X-Forwarded-Port / X-ProxyPort:
# NiFi appends the value verbatim to its redirect_uri, breaking Keycloak's strict match.
nifi:
  name: nifi
  description: NiFi route pass-through with HTTPS proxy headers
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            ngx.req.clear_header("X-Userinfo")
            ngx.req.clear_header("X-Access-Token")
            ngx.req.clear_header("X-Allowed-Scope-Ids")
          end
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-ProxyScheme: https
