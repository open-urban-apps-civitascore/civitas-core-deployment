---
superset:
  superset:
    secret-key:
      secret-key:
        length: 64
        generate: true
    # Superset Chart requires to load some secrets from `release-name-superset-env`
    # Deployment will fail if this secret is not present
    superset-superset-env:
      not-used-secret:
        length: 32
        generate: true
