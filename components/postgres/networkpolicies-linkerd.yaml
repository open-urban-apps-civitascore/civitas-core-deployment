---
postgres-allow-linkerd:
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        # CloudNative-PG operator: allow from the operator's namespace only. The shared
        # operator runs in a separate namespace in the multi-instance model and in the
        # instance namespace in legacy mode; componentNamespace: postgres.operator resolves
        # to postgres.operator.namespace for both. The podSelector keeps the peer restricted
        # to the cnpg operator pod.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
          componentNamespace: postgres.operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz-repo
          componentNamespace: authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz
          componentNamespace: authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frost-frost
          componentNamespace: frost
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-role-setup
          componentNamespace: postgres
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: portal-db-create-role-authz-readonly
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app: superset
          componentNamespace: superset
        - podSelector:
            matchLabels:
              app: superset-worker
          componentNamespace: superset
        - podSelector:
            matchLabels:
              job-name: superset-superset-init-db
          componentNamespace: superset
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
