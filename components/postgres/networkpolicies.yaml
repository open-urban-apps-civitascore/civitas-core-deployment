---
postgres:
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    # CloudNative-PG operator: allow from the operator's namespace only. The shared operator
    # runs in a separate namespace (global.operators.namespace) in the multi-instance model,
    # while in single-instance mode it runs in the instance namespace.
    # componentNamespace: postgres.operator resolves to postgres.operator.namespace, which
    # civitas.operatorNamespace sets correctly for both models; the podSelector further
    # restricts the peer to the cnpg operator pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
          componentNamespace: postgres.operator
    # Join jobs run in the cluster's (instance) namespace in both models.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/jobRole: join
          componentNamespace: postgres
    # Postgres cluster running with multiple pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
              app.kubernetes.io/name: postgresql
          componentNamespace: postgres
    # Portal backend - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
              app.kubernetes.io/name: portal
          componentNamespace: portal
    # Keycloak - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
              app.kubernetes.io/name: keycloakx
          componentNamespace: keycloak
    # Authz - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz-repo
          componentNamespace: authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz
          componentNamespace: authz
    # Frost - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frost-frost
              app: frost-server
          componentNamespace: frost
    # Database role setup jobs - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-role-setup
              app.kubernetes.io/name: databases
          componentNamespace: postgres
    # Config adapter
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
          componentNamespace: config-adapters
    # Portal database job (authz readonly role creation)
    - from:
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: portal-db-create-role-authz-readonly
          componentNamespace: portal
    # Geoserver
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: rest
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: wcs
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: wms
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: wfs
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: webui
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
    # Superset
    - from:
        - podSelector:
            matchLabels:
              app: superset
              release: superset-superset
          componentNamespace: superset
    - from:
        - podSelector:
            matchLabels:
              app: superset-worker
              release: superset-superset
          componentNamespace: superset
    - from:
        - podSelector:
            matchLabels:
              job-name: superset-superset-init-db
          componentNamespace: superset
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: nifi-nifi
              app.kubernetes.io/name: nifi
          componentNamespace: nifi

# Admission webhook: the kube-apiserver calls the CloudNativePG operator's
# mutating/validating webhook (mcluster/mdatabase) on :9443. The apiserver is not
# selectable as a NetworkPolicy peer (it connects from the control-plane/host
# network with a cluster-dependent source IP), so allow the webhook port from any
# source; the podSelector + port keep this scoped to the operator's webhook
# endpoint only. Without this, the operator namespace's default-deny (default-deny
# for the runtime-policies component, which shares the operator namespace) blocks
# the webhook and Cluster/Database CR applies intermittently fail with a 502 from
# cnpg-webhook-service.
postgres-operator-webhook:
  deployLayer: operators
  componentNamespace: postgres.operator
  podSelector:
    app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 9443
