---
postgres:
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    # CloudNative-PG operator - allow from all namespaces
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
    # Portal backend - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
    # Keycloak - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
    # Authz - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz-repo
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authz
    # Frost - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frost-frost
    # Database role setup jobs - auto-inject instanceSlug namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-role-setup
    # Portal database job (authz readonly role creation)
    - from:
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: portal-db-create-role-authz-readonly
