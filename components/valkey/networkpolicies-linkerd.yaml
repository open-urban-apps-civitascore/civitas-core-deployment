---
valkey-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: valkey-valkey
    app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
          componentNamespace: valkey
        - podSelector:
            matchLabels:
              app: superset
              release: superset-superset
          componentNamespace: superset
        - podSelector:
            matchLabels:
              app: superset-worker
              release: superset-superset
          componentNamespace: superset
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
