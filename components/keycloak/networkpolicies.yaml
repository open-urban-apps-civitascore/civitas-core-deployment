---
keycloak:
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-config-cli
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi-bootstrap
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
        - podSelector:
            matchLabels:
              app: nifi
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
