---
keycloak:
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-config-cli
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi-bootstrap
    # Allow Keycloak replicas to reach each other on the JGroups cluster ports
    # (7800 = TCP transport, 57800 = FD_SOCK2 failure detection). Required so the
    # Infinispan/JGroups cluster can form. Without this the pods get
    # "Connection refused" on 7800 and degrade into isolated singletons.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800

