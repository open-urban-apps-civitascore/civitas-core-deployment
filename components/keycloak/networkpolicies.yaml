---
keycloak:
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-config-cli
