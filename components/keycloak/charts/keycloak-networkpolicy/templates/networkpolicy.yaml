{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-config-cli
    {{/* todo: remove this when keycloak is behind apisix */}}
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
