---
keycloak-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-config-cli
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi-bootstrap
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
