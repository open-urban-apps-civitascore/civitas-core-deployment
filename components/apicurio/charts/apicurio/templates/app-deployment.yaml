{{- if .Values.registry.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.registry.app.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "apicurio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "apicurio.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.registry.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.registry.app.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.registry.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: apicurio-registry-app
        image: "{{ .Values.registry.app.image.repository }}:{{ .Values.registry.app.image.tag }}"
        imagePullPolicy: {{ .Values.registry.app.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        {{- /* Storage Configuration */}}
        {{- if eq .Values.registry.app.storage.type "postgresql" }}
        - name: APICURIO_STORAGE_KIND
          value: "sql"
        - name: APICURIO_STORAGE_SQL_KIND
          value: "postgresql"
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: {{ .Values.registry.app.storage.sql.dataSource.url | quote }}
        - name: QUARKUS_DATASOURCE_USERNAME
          value: {{ .Values.registry.app.storage.sql.dataSource.username | quote }}
        {{- if .Values.registry.app.storage.sql.dataSource.passwordSecretRef }}
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.app.storage.sql.dataSource.passwordSecretRef.name }}
              key: {{ .Values.registry.app.storage.sql.dataSource.passwordSecretRef.key | default "password" }}
        {{- end }}
        {{- else if eq .Values.registry.app.storage.type "kafkasql" }}
        - name: APICURIO_STORAGE_KIND
          value: "kafkasql"
        - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
          value: {{ .Values.registry.app.storage.kafkasql.bootstrapServers | quote }}
        {{- if .Values.registry.app.storage.kafkasql.auth.enabled }}
        - name: APICURIO_KAFKASQL_SECURITY_PROTOCOL
          value: "SASL_PLAINTEXT"
        - name: APICURIO_KAFKASQL_SASL_MECHANISM
          value: {{ .Values.registry.app.storage.kafkasql.auth.mechanism | default "PLAIN" | quote }}
        {{- if .Values.registry.app.storage.kafkasql.auth.clientIdRef }}
        - name: APICURIO_KAFKASQL_SASL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.app.storage.kafkasql.auth.clientIdRef.name }}
              key: {{ .Values.registry.app.storage.kafkasql.auth.clientIdRef.key | default "client-id" }}
        {{- end }}
        {{- if .Values.registry.app.storage.kafkasql.auth.clientSecretRef }}
        - name: APICURIO_KAFKASQL_SASL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.registry.app.storage.kafkasql.auth.clientSecretRef.name }}
              key: {{ .Values.registry.app.storage.kafkasql.auth.clientSecretRef.key | default "client-secret" }}
        {{- end }}
        {{- if .Values.registry.app.storage.kafkasql.auth.tokenEndpoint }}
        - name: APICURIO_KAFKASQL_SASL_TOKEN_ENDPOINT
          value: {{ .Values.registry.app.storage.kafkasql.auth.tokenEndpoint | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- /* Authentication Configuration */}}
        {{- if .Values.registry.app.auth.enabled }}
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: {{ .Values.registry.app.auth.authServerUrl | quote }}
        - name: QUARKUS_OIDC_CLIENT_ID
          value: {{ .Values.registry.app.auth.appClientId | quote }}
        {{- if .Values.registry.app.auth.anonymousReadsEnabled }}
        - name: APICURIO_AUTH_ANONYMOUS_READS_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.registry.app.auth.authz.enabled }}
        - name: APICURIO_AUTH_ROLE_BASED_AUTHORIZATION
          value: "true"
        {{- if .Values.registry.app.auth.authz.ownerOnlyEnabled }}
        - name: APICURIO_AUTH_OWNER_ONLY_AUTHORIZATION
          value: "true"
        {{- end }}
        {{- if .Values.registry.app.auth.authz.groupAccessEnabled }}
        - name: APICURIO_AUTH_OWNER_ONLY_AUTHORIZATION_LIMIT_GROUP_ACCESS
          value: "true"
        {{- end }}
        {{- if .Values.registry.app.auth.authz.readAccessEnabled }}
        - name: APICURIO_AUTH_AUTHENTICATED_READS_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.registry.app.auth.authz.roles }}
        - name: APICURIO_AUTH_ROLE_SOURCE
          value: {{ .Values.registry.app.auth.authz.roles.source | default "token" | quote }}
        {{- if .Values.registry.app.auth.authz.roles.admin }}
        - name: APICURIO_AUTH_ROLE_ADMIN
          value: {{ .Values.registry.app.auth.authz.roles.admin | quote }}
        {{- end }}
        {{- if .Values.registry.app.auth.authz.roles.developer }}
        - name: APICURIO_AUTH_ROLE_DEVELOPER
          value: {{ .Values.registry.app.auth.authz.roles.developer | quote }}
        {{- end }}
        {{- if .Values.registry.app.auth.authz.roles.readOnly }}
        - name: APICURIO_AUTH_ROLE_READONLY
          value: {{ .Values.registry.app.auth.authz.roles.readOnly | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- /* Features Configuration */}}
        {{- if .Values.registry.app.features }}
        {{- if .Values.registry.app.features.resourceDeleteEnabled }}
        - name: APICURIO_REST_DELETION_ARTIFACT_ENABLED
          value: "true"
        - name: APICURIO_REST_DELETION_ARTIFACT_VERSION_ENABLED
          value: "true"
        - name: APICURIO_REST_DELETION_GROUP_ENABLED
          value: "true"
        {{- end }}
        {{- if .Values.registry.app.features.versionMutabilityEnabled }}
        - name: APICURIO_REST_MUTATION_VERSION_ENABLED
          value: "true"
        {{- end }}
        {{- end }}
        {{- /* Custom Environment Variables */}}
        {{- with .Values.registry.app.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.registry.app.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        {{- end }}
        {{- with .Values.registry.app.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        {{- with .Values.registry.app.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        {{- with .Values.registry.app.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.registry.app.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        # Writable /tmp for Quarkus/Vert.x cache when readOnlyRootFilesystem is enabled
        - name: tmp
          mountPath: /tmp
        {{- with .Values.registry.app.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      # Writable /tmp for Quarkus/Vert.x cache when readOnlyRootFilesystem is enabled
      - name: tmp
        emptyDir: {}
      {{- with .Values.registry.app.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.registry.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}

      {{- end }}
      {{- with .Values.registry.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
