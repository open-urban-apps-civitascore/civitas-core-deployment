{{- if and .Values.registry.enabled .Values.registry.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.registry.ui.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "apicurio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "apicurio.labels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- with .Values.registry.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.registry.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.registry.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      # The UI image (UBI/nginx) writes its nss_wrapper passwd file into
      # /opt/app-root/etc at startup. With readOnlyRootFilesystem enabled that
      # directory is not writable, so copy its contents into a writable emptyDir
      # which is then mounted over /opt/app-root/etc in the main container.
      - name: copy-app-root-etc
        image: "{{ .Values.registry.ui.image.repository }}:{{ .Values.registry.ui.image.tag }}"
        imagePullPolicy: {{ .Values.registry.ui.image.pullPolicy | default "IfNotPresent" }}
        command:
        - sh
        - -c
        # Copy contents (not attributes); the emptyDir mount root cannot have its
        # ownership/timestamps changed by the non-root user, so avoid `cp -a`.
        - cp -RL /opt/app-root/etc/. /writable-app-root-etc/
        volumeMounts:
        - name: app-root-etc
          mountPath: /writable-app-root-etc

        {{- with .Values.registry.ui.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
      - name: apicurio-registry-ui
        image: "{{ .Values.registry.ui.image.repository }}:{{ .Values.registry.ui.image.tag }}"
        imagePullPolicy: {{ .Values.registry.ui.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: REGISTRY_API_URL
          value: "https://{{ .Values.registry.app.ingress.host }}/apis/registry/v3"
        {{- if .Values.registry.app.auth.enabled }}
        - name: AUTH_ENABLED
          value: {{ .Values.registry.app.auth.enabled | quote }}
        - name: OIDC_AUTH_URL
          value: {{ .Values.registry.app.auth.authServerUrl | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ .Values.registry.app.auth.uiClientId | quote }}
        {{- if .Values.registry.app.auth.redirectUri }}
        - name: OIDC_REDIRECT_URI
          value: {{ .Values.registry.app.auth.redirectUri | quote }}
        {{- end }}
        {{- if .Values.registry.app.auth.logoutUrl }}
        - name: OIDC_LOGOUT_URL
          value: {{ .Values.registry.app.auth.logoutUrl | quote }}
        {{- end }}
        {{- end }}
        {{- /* Custom Environment Variables */}}
        {{- with .Values.registry.ui.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.registry.ui.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        startupProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        {{- end }}
        {{- with .Values.registry.ui.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        {{- with .Values.registry.ui.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- else }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        {{- with .Values.registry.ui.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.registry.ui.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        # Writable paths required by the UBI/nginx image when readOnlyRootFilesystem is enabled
        - name: tmp
          mountPath: /tmp
        - name: app-root-etc
          mountPath: /opt/app-root/etc
        - name: nginx-log
          mountPath: /var/log/nginx
        - name: nginx-lib
          mountPath: /var/lib/nginx
        - name: run
          mountPath: /run
        {{- with .Values.registry.ui.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      # Writable paths required by the UBI/nginx image when readOnlyRootFilesystem is enabled
      - name: tmp
        emptyDir: {}
      - name: app-root-etc
        emptyDir: {}
      - name: nginx-log
        emptyDir: {}
      - name: nginx-lib
        emptyDir: {}
      - name: run
        emptyDir: {}
      {{- with .Values.registry.ui.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.registry.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.registry.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
