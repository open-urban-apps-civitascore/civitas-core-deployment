{{- if and .Values.registry.enabled .Values.registry.ui.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apicurio.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apicurio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.registry.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.registry.ui.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.registry.ui.service.port | default 8080 }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "apicurio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
