---
# Apicurio Registry Helm Chart Values

# Override chart name
nameOverride: ''
fullnameOverride: ''

# Image pull secrets for private registries
imagePullSecrets: []

# Apicurio Registry instance configuration
registry:
  # Enable/disable creation of registry resources
  enabled: false

  app:
    # Backend container image configuration
    image:
      repository: quay.io/apicurio/apicurio-registry
      tag: '3.1.2'
      pullPolicy: IfNotPresent

    # Storage configuration for Apicurio Registry backend
    storage:
      # Storage type: empty (in-memory), "postgresql", or "kafkasql"
      # IMPORTANT: In-memory storage is not suitable for production
      type: ''

      # SQL storage configuration (when type is "postgresql")
      sql:
        dataSource:
          # JDBC connection URL
          # Example: jdbc:postgresql://postgres-host:5432/apicurio
          url: ''
          # Database username
          username: ''
          # Password secret reference
          passwordSecretRef:
            # Name of the secret containing the password
            name: ''
            # Key in the secret (defaults to "password")
            key: password

      # KafkaSQL storage configuration (when type is "kafkasql")
      kafkasql:
        # Kafka bootstrap servers
        bootstrapServers: ''
        # Authentication configuration
        auth:
          enabled: false
          mechanism: ''
          tokenEndpoint: ''
          clientIdRef:
            name: ''
            key: ''
          clientSecretRef:
            name: ''
            key: ''
        # TLS configuration
        tls:
          truststoreSecretRef:
            name: ''
            key: ''
          truststorePasswordSecretRef:
            name: ''
            key: ''
          keystoreSecretRef:
            name: ''
            key: ''
          keystorePasswordSecretRef:
            name: ''
            key: ''

    # Service configuration for the registry backend
    service:
      type: ClusterIP
      port: 8080
      annotations: {}

    # Ingress configuration for the registry backend API
    ingress:
      enabled: true
      # Hostname for the registry API
      host: ''
      # IngressClass name
      ingressClassName: ''
      # Additional annotations
      annotations: {}
      # TLS configuration
      tls: []
      # - secretName: apicurio-tls
      #   hosts:
      #     - apicurio.example.com

    # Number of backend replicas
    replicas: 1

    # Authentication and authorization configuration
    auth:
      enabled: false
      # OIDC/OAuth2 server URL
      authServerUrl: ''
      # Client ID for the backend application
      appClientId: ''
      # Client ID for the UI application
      uiClientId: ''
      # Redirect URI after authentication
      redirectUri: ''
      # Logout URL
      logoutUrl: ''
      # Allow anonymous read access
      anonymousReadsEnabled: false
      # Authorization configuration
      authz:
        enabled: false
        ownerOnlyEnabled: false
        groupAccessEnabled: false
        readAccessEnabled: false
        roles:
          source: token
          admin: sr-admin
          developer: sr-developer
          readOnly: sr-readonly
      # TLS configuration for OIDC
      tls:
        tlsVerificationType: ''
        truststoreSecretRef:
          name: ''
          key: ''
        truststorePasswordSecretRef:
          name: ''
          key: ''

    # Registry features
    features:
      # Allow deletion of artifacts, versions, and groups
      resourceDeleteEnabled: false
      # Allow modification of artifact versions in DRAFT state
      versionMutabilityEnabled: false

    # Additional environment variables
    env: []
    # - name: CUSTOM_VAR
    #   value: custom-value

    # Resource limits and requests
    resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 1Gi
    # requests:
    #   cpu: 500m
    #   memory: 512Mi

    # Startup probe configuration
    startupProbe: {}

    # Liveness probe configuration
    livenessProbe: {}

    # Readiness probe configuration
    readinessProbe: {}

    # Pod disruption budget
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
      # maxUnavailable: 1

    # Pod annotations and labels
    podAnnotations: {}
    podLabels: {}

    # Security contexts
    # podSecurityContext is applied at the Pod level (.spec.template.spec.securityContext)
    podSecurityContext: {}
    # securityContext is applied at the container level (.spec.template.spec.containers[].securityContext)
    securityContext: {}

    # Node selection
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Image pull secrets
    imagePullSecrets: []

  # UI component configuration

  ui:
    enabled: true

    # UI container image configuration
    image:
      repository: quay.io/apicurio/apicurio-registry-ui
      tag: '3.1.2'
      pullPolicy: IfNotPresent

    # Service configuration for the UI
    service:
      type: ClusterIP
      port: 8080
      annotations: {}

    # Ingress configuration for the registry UI
    ingress:
      enabled: true
      # Hostname for the registry UI
      host: ''
      # IngressClass name
      ingressClassName: ''
      # Additional annotations
      annotations: {}
      # TLS configuration
      tls: []
      # - secretName: apicurio-ui-tls
      #   hosts:
      #     - apicurio-ui.example.com

    # Number of UI replicas
    replicas: 1

    # Additional environment variables
    env: []

    # Resource limits and requests
    resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

    # Startup probe configuration
    startupProbe: {}

    # Liveness probe configuration
    livenessProbe: {}

    # Readiness probe configuration
    readinessProbe: {}

    # Pod disruption budget
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
      # maxUnavailable: 1

    # Pod annotations and labels
    podAnnotations: {}
    podLabels: {}

    # Security contexts
    # podSecurityContext is applied at the Pod level (.spec.template.spec.securityContext)
    podSecurityContext: {}
    # securityContext is applied at the container level (.spec.template.spec.containers[].securityContext)
    securityContext: {}

    # Node selection
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Image pull secrets
    imagePullSecrets: []

