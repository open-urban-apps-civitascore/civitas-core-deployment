---
apicurio-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: apicurio-apicurio
    app.kubernetes.io/name: apicurio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: model-atlas
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
