---
geoserver:
  name: 'geoserver'
  embedded: true # set to false, if an external database is used
  user: 'geoserver'
  secret:
    name: 'db-geoserver'
    key: 'password'
    generate: true # indicates that this value should be generated
  # TODO: hostServiceName may break external databases,
  # as it is used to construct the hostname for the database connection.
  hostServiceName: 'postgres-cluster-rw' # set to external hostname, if an external database is used
  port: 5432
payload_data:
  name: 'payload_data'
  embedded: true
  user: 'payload_data'
  secret:
    name: 'db-payload-data'
    key: 'password'
    generate: true
  hostServiceName: 'postgres-cluster-rw'
  port: 5432
  extensions:
    - name: postgis
