---
# rest->DB (in postgres)
# wcs->DB (in postgres)
# wms->DB (in postgres)
# all gsc services->rabbitmq (Spring Cloud Bus)

# name must match lower case alphanumeric characters
geoserver-rabbitmq:
  podSelector:
    app.kubernetes.io/instance: geoserver-rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: geoserver-geoserver
              app.kubernetes.io/name: gsc
          componentNamespace: geoserver
geoserver:
  podSelector:
    app.kubernetes.io/component: rest
    app.kubernetes.io/instance: geoserver-geoserver
    app.kubernetes.io/name: gsc
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
          componentNamespace: config-adapters
