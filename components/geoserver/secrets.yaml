---
geoserver:
  geoserver:
    geoserver-rabbitmq-admin:
      rabbitmq-password:
        length: 16
        generate: true
      componentNamespaces:
        - geoserver
    db-geoserver:
      password:
        length: 32
        generate: true
      username: 'geoserver'
      componentNamespaces:
        - geoserver
        - postgres
    db-payload-data:
      password:
        length: 32
        generate: true
      username: 'payload_data'
      componentNamespaces:
        - geoserver
        - postgres
        - configAdapters
