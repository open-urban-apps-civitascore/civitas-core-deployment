---
apisix:
  podSelector:
    app.kubernetes.io/name: apisix
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: apisix-static-configuration
      ports:
        - protocol: TCP
          port: 9180
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
