---
plugins:
  {}
  # Example plugin configuration:
  # frost:
  #   name: 'frost'
  #   description: 'FROST-Server API'
  #   plugin:
  #     openid_opa_proxy_rewrite_request_id:
  #       opa:
  #         host: 'http://authz-authz-opa.example.svc.cluster.local:8181'
  #         policy: 'civitas/authz/decision'

routes:
  {}
  # Example route configuration:
  # frost:
  #   name: 'FROST-Server API'
  #   description: 'FROST-Server API'
  #   upstream: 'frost-server'
  #   uri: '/FROST-Server/v1.1'
  #   plugin_id: 'openid_opa_proxy_rewrite_request_id'
  #   scheme: 'https'  # Optional: set to 'https' for HTTPS upstreams (auto-disables TLS verify)

domain: 'example.com'
# Always overridden per instance (set to global.instanceSlug in
# values/configuration/base-values.yaml.gotmpl). Empty default => fail fast if the
# override is ever missing instead of silently using a wrong realm.
realm: ''

# Container image configuration for the route display job
image:
  repository: alpine/curl
  tag: '8.17.0'
  pullPolicy: IfNotPresent

# Pod-level security context for the route display job
podSecurityContext: {}

# Container-level security context for the route display job
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Resource limits and requests for the route display job
resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 16Mi

secret:
  adminKeySecretName: apisix-admin-credentials
  adminKeySecretKey: admin

# Extra environment variables sourced from Kubernetes secrets
# Example:
# extraSecretEnvVars:
#   - name: APISIX_VALIDATOR_CLIENT_SECRET
#     secretName: keycloak-client-apisix-validator
#     secretKey: client-secret
extraSecretEnvVars: []

apisix:
  host: apisix
  port: 9180

# Service mesh integration. When enabled, a Linkerd `Server` marks the APISIX
# data plane as a public edge reachable by the unmeshed nginx ingress
# controller, so a mandatory default-inbound-policy on the namespace does not
# reject ingress traffic.
serviceMesh:
  enabled: false
  # Selects the APISIX data-plane pods.
  podSelector:
    app.kubernetes.io/name: apisix
  # Container port of the APISIX data plane (the public HTTP entry point).
  dataPlanePort: 9080
  # Whether the ingress edge may reach the data plane WITHOUT mTLS.
  #   true  -> Server accessPolicy `all-unauthenticated`: plaintext from an
  #            unmeshed nginx ingress controller is accepted.
  #   false -> Server accessPolicy `all-authenticated`: only authenticated mesh
  #            identities may connect, i.e. the ingress controller must be meshed.
  allowUnauthenticatedIngress: false
