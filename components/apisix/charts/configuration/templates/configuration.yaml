{{- if and (not (empty .Values.plugins)) (not (empty .Values.routes)) }}
{{ $root := . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-static-configuration
  labels:
    app.kubernetes.io/component: apisix-static-configuration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: apisix-static-configuration
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 60
      {{- with $root.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: create-plugin-configuration
        image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        {{- with $root.Values.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $root.Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: APISIX_ADMIN_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $root.Values.secret.adminKeySecretName }}
                key: {{ $root.Values.secret.adminKeySecretKey }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          trap "echo 'Received SIGTERM, exiting gracefully...'; exit 0" SIGTERM
          # Wait for APISIX to be ready
          timeout 15s sh -c 'echo "Waiting for APISIX to be ready..."; until nc -z {{ $root.Values.apisix.host }} {{ $root.Values.apisix.port }}; do sleep 2; done'
          echo "Creating initial configuration in APISIX..."
{{ range $component, $config := $root.Values.plugins }}

          echo "Configuring plugin: {{ $component }}"
          curl -s -X PUT http://{{ $root.Values.apisix.host }}:{{ $root.Values.apisix.port }}/apisix/admin/plugin_configs/{{ $component }} -H "X-API-KEY: ${APISIX_ADMIN_KEY}" -H "Content-Type: application/json" -d '{
            "name": "{{ $config.name }}",
            "desc": "{{ $config.description }}",
            "plugins": {{ $config.plugins | toJson }}
          }' || exit 1
{{- end }}
{{ range $component, $config := $root.Values.routes }}

          echo "Configuring service: {{ $component }}"
          curl -s -X PUT http://{{ $root.Values.apisix.host }}:{{ $root.Values.apisix.port }}/apisix/admin/services/{{ $component }} -H "X-API-KEY: ${APISIX_ADMIN_KEY}" -H "Content-Type: application/json" -d '{
            "name": "{{ $config.name }}",
            "desc": "{{ $config.description }}",
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "{{ $config.upstream }}": 1
              },
              "timeout": {
                "connect": 6,
                "send": 6,
                "read": 6
              }
            }
          }' || exit 1
          echo "Configuring route: {{ $component }}"
          curl -s -X PUT http://{{ $root.Values.apisix.host }}:{{ $root.Values.apisix.port }}/apisix/admin/routes/{{ $component }} -H "X-API-KEY: ${APISIX_ADMIN_KEY}" -H "Content-Type: application/json" -d '{
            "name": "{{ $config.name }}",
            "desc": "{{ $config.description }}",
            "uri": "{{ $config.uri }}",
            "service_id": "{{ $component }}",
            "plugin_config_id": "{{ $component }}"
            {{- if hasKey $config "subDomain" }},
            "host": "{{ $config.subDomain }}.{{ $root.Values.domain }}"
            {{- end }}
          }' || exit 1
{{- end }}
{{- end }}
