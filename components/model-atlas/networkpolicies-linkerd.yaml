---
model-atlas-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: model-atlas-model-atlas
    app.kubernetes.io/name: model-atlas
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
              app.kubernetes.io/component: backend
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
