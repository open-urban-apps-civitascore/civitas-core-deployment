apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "model-atlas.fullname" . }}-test-connection"
  labels:
    {{- include "model-atlas.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 8 }}
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "model-atlas.fullname" . }}:{{ .Values.service.port }}']
      securityContext:
        {{- toYaml .Values.securityContext | nindent 12 }}
  restartPolicy: Never
