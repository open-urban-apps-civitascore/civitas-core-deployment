{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-atlas.fullname" . }}
  labels:
    {{- include "model-atlas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "model-atlas.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: portal
              app.kubernetes.io/component: backend
{{- end }}
