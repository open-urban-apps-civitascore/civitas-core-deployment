---
frost-server:
  name: frost-server
  description: FROST-Server API
  plugins:
    opa:
      host: http://authz-authz-opa:8181 # TODO: make it more dynamic
      policy: civitas/authz/decision
      with_route: true
      with_service: true
      with_consumer: false
      send_headers_upstream:
        - X-Allowed-Scope-Ids
    proxy-rewrite:
      headers:
        remove:
          - X-Userinfo
          - X-Access-Token
          - X-Allowed-Scope-Ids
        set:
          # Frost is secured by OpenPolicyAgent but still requires basic auth (writer:writer)
          Authorization: 'Basic d3JpdGU6d3JpdGU='
    request-id:
      include_in_response: true
