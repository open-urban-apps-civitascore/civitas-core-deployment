---
frost-server:
  name: frost-server
  description: FROST-Server API
  plugins:
    opa:
      host: http://authz-authz-opa:8181 # TODO: make it more dynamic
      policy: civitas/authz/decision
      with_route: true
      with_service: true
      with_consumer: false
      send_headers_upstream:
        - X-Allowed-Scope-Ids
    serverless-pre-function:
      phase: rewrite
      functions:
        - 'return function() ngx.req.clear_header("X-Userinfo"); ngx.req.clear_header("X-Access-Token"); ngx.req.clear_header("X-Allowed-Scope-Ids") end'
    proxy-rewrite:
      headers:
        set:
          # Frost is secured by OpenPolicyAgent but still requires basic auth (writer:writer)
          Authorization: 'Basic d3JpdGU6d3JpdGU='
    request-id:
      include_in_response: true
