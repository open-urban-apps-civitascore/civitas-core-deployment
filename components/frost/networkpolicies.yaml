---
frost:
  podSelector:
    app.kubernetes.io/instance: frost-frost
  policyTypes:
    - Ingress
  ingress:
    # APISIX Gateway proxied den externen Traffic zu FROST
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - protocol: TCP
          port: 8080
    # Config-Adapter greift direkt auf FROST zu (CRUD fuer Things, Sensors, etc.)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
          componentNamespace: config-adapters
      ports:
        - protocol: TCP
          port: 8080
    # Nifi greift direkt auf FROST zu (CRUD fuer Things, Sensors, etc.)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
          componentNamespace: nifi
      ports:
        - protocol: TCP
          port: 8080
