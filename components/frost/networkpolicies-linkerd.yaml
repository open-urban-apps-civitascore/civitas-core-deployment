---
frost-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: frost-frost
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: config-adapter
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nifi
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
