---
# Ingress: block all connections
config-adapter:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Ingress
  ingress:

# Egress: Allow outbound connections
config-adapter-egress:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Egress
  egress:
    # DNS resolution (required for all service lookups)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - vcluster-kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 1053
          protocol: UDP
        - port: 1053
          protocol: TCP

    # Keycloak (for client management and auth)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
      ports:
        - port: 8080
          protocol: TCP

    # FROST (for SensorThings API configuration)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frost-frost
      ports:
        - port: 8080
          protocol: TCP

    # ETCD (for configuration storage)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: etcd
      ports:
        - port: 2379
          protocol: TCP

    # PostgreSQL (if config-adapter needs direct DB access)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP

    # Kafka (for event streaming)
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: kafka-cluster
      ports:
        - port: 9092
          protocol: TCP

    # APISIX (if config-adapter needs to access gateway)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
      ports:
        - port: 9080
          protocol: TCP
