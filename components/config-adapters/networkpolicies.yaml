---
# Ingress: Allow health checks from kubelet
config-adapter:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Ingress
  ingress:
    # Allow health checks from kubelet (liveness/readiness probes)
    - ports:
        - protocol: TCP
          port: 8080

# Ingress: Allow Linkerd proxy traffic
config-adapter-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# Egress: Allow outbound connections
config-adapter-egress:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Egress
  egress:
    # DNS resolution (required for all service lookups)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Linkerd control plane (required for service mesh mTLS)
    - to:
        - namespaceSelector: 'linkerd'
      ports:
        - port: 8080 # linkerd-identity
          protocol: TCP
        - port: 8086 # linkerd-destination
          protocol: TCP
        - port: 8090 # linkerd-policy
          protocol: TCP

    # Linkerd proxy data plane (required for all meshed service-to-service communication)
    - ports:
        - port: 4143
          protocol: TCP

    # Linkerd proxy admin port (same pod, no namespace restriction)
    - ports:
        - port: 4191
          protocol: TCP

    # Keycloak (for client management and auth)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
      ports:
        - port: 8080
          protocol: TCP

    # FROST (for SensorThings API configuration)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frost-frost
      ports:
        - port: 8080
          protocol: TCP

    # ETCD (for configuration storage)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: etcd
      ports:
        - port: 2379
          protocol: TCP

    # PostgreSQL (if config-adapter needs direct DB access)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP

    # Kafka (for event streaming)
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: kafka-cluster
      ports:
        - port: 9092
          protocol: TCP

    # APISIX (if config-adapter needs to access gateway)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
      ports:
        - port: 9080
          protocol: TCP
