---
config-adapter:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Ingress
  ingress:
    # Allow health checks from kubelet (liveness/readiness probes)
    - ports:
        - protocol: TCP
          port: 8080

config-adapter-allow-linkerd:
  podSelector:
    app.kubernetes.io/instance: config-adapters-adapters
    app.kubernetes.io/name: config-adapter
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
