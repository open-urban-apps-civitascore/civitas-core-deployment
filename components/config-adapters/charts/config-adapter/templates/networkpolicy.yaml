{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "config-adapter.fullname" . }}
  labels:
    {{- include "config-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "config-adapter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow health checks from kubelet (liveness/readiness probes)
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
