{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "config-adapter.fullname" . }}
  labels:
    {{- include "config-adapter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "config-adapter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health checks from kubelet (liveness/readiness probes)
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Allow DNS resolution (kube-dns/CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to Kafka (port 9092)
    - ports:
        - protocol: TCP
          port: 9092
    # Allow egress to Keycloak (port 80)
    - ports:
        - protocol: TCP
          port: 80
    # Allow egress to APISIX Admin (port 9180)
    - ports:
        - protocol: TCP
          port: 9180
{{- end }}
