---
configAdapters:
  adapters:
    config-adapter-keycloak-user:
      # Password must meet realm policy: length(12), upperCase(1), lowerCase(1), digits(1), specialChars(1)
      # special: true picks one random safe special char and shuffles all chars so no character
      password:
        length: 32
        generate: true
        special: true
