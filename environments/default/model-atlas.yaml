---
modelAtlas:
  enabled: true
  namespace: main-civitas2
  chartVersion: '0.1.0'
  image:
    repository: eclipsefennec/model.atlas
    tag: snapshot
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  ingress:
    enabled: false
    className: 'nginx'
    annotations: {}
    hosts:
      - host: model-atlas.main.civitas2.fw-web.space
        paths:
          - path: /
            pathType: Prefix
    tls: []
