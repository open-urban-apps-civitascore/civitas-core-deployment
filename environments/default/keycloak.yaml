---
keycloak:
  enabled: true
  chartVersion: '7.1.4'
  namespace: main-civitas2
  admin:
    user: admin
    secret:
      name: keycloak-admin-user
      key: admin-password
    createSecret: true
    forceRecreateSecret: false
  database:
    #   enabled: true
    # name: db-keycloak
    # user: "keycloak"
    # secret:
    #   name: db-keycloak
    #   key: password
    # host: db-cluster-rw.civitas.svc.cluster.local
    # port: 5432
    checker:
      enabled: true
      image:
        repository: docker.io/busybox
        tag: 1.32
      resources:
        requests:
          cpu: '20m'
          memory: '32Mi'
        limits:
          cpu: '20m'
          memory: '32Mi'
  image:
    repository: quay.io/keycloak/keycloak
    tag: '26.4.0'
    digest: ''
  updateStrategy: RollingUpdate
  resources:
    requests:
      memory: '512Mi'
      cpu: '250m'
    limits:
      memory: '4Gi'
      cpu: '2000m'
  service:
    annotations: {}
    labels: {}
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    labels: {}
    domain: keycloak.main.civitas2.fw-web.space
    tls:
      secretName: keycloak-tls
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUtilizationPercentage: 80
    metrics:
      cpuUtilization: 80
  config:
    # TODO: see https://github.com/adorsys/keycloak-config-cli/issues/1287#issuecomment-3338550468
    chartVersion: '1.3.1'
    image:
      repository: docker.io/adorsys/keycloak-config-cli
      tag: '6.4.0-26'
    resources:
      limits:
        cpu: '1000m'
        memory: '1024Mi'
      requests:
        cpu: '100m'
        memory: '1024Mi'
    availabilityCheckTimeout: '120s'
    realm:
      name: civitas
      id: civitas
      # TODO: find a solution for secret management
      # smtp:
      #   password: password
      #   starttls: true
      #   host: smtp.example.com
      #   port: '587'
      #   from: no-reply@civitas.io
      #   user: smtp-user
      theme: civitas-theme
      enable_events: true
      enable_adminEvents: true
  probesInitialDelaySeconds:
    liveness: 60
    readiness: 60
    startup: 0
