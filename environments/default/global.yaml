---
global:
  domain: civitas.test
  namespacePrefix: civitas
  instanceSlug: dev

defaults:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: '1Gi'
    limits:
      cpu: '2'
      memory: '4Gi'
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    certManager:
      clusterIssuer: letsencrypt-prod
