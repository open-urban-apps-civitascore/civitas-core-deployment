---
apisix:
  namespace: main-civitas2
  enabled: true
  chartVersion: '2.12.0'
  image:
    repository: apache/apisix
    tag: '3.14.1-ubuntu'
  apisix:
    enable: true
    admin:
      domain: apisix.main.civitas2.fw-web.space
      path: /
      credentials:
        secretName: apisix-admin-credentials
        secretAdminKey: admin
        secretViewerKey: viewer
        forceRecreateSecret: false
  replicaCount: 2
  resources:
    requests:
      memory: '256Mi'
      cpu: '250m'
    limits:
      memory: '1Gi'
      cpu: '1000m'
  timezone: 'Europe/Berlin'
  ingressController:
    enabled: true
