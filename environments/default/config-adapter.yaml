---
configAdapter:
  enabled: true
  namespace: main-civitas2
  image:
    repository: registry.gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/config-adapter
    tag: '0.0.0-667-gccd23de'
    pullPolicy: Always
  replicaCount: 1
  eventhandler:
    name: kafka
  kafka:
    bootstrapServers: 'kafka-cluster-kafka-bootstrap.main-civitas2.svc.cluster.local:9092'
    groupId: 'config-adapter-group'
  # Adapter configurations
  adapters:
    keycloak:
      url: 'http://keycloak-http.main-civitas2.svc.cluster.local:8080'
      realm: 'civitas'
      username: 'admin'
      # Reference to existing keycloak admin secret
      passwordSecret:
        name: 'keycloak-admin-user'
        key: 'admin-password'
      clientId: 'admin-cli'
      # Topics that keycloak adapter subscribes to
      topics: 'core.civitas.idm.user.created,core.civitas.idm.user.updated,core.civitas.idm.realm.created'
    apisix:
      adminUrl: 'http://apisix-admin.main-civitas2.svc.cluster.local:9180'
      # Reference to existing apisix admin secret
      adminKeySecret:
        name: 'apisix-admin-credentials'
        key: 'admin'
      # Topics that apisix adapter subscribes to
      topics: 'core.civitas.api.backend.created,core.civitas.api.backend.updated,core.civitas.api.backend.deleted'
  healthcheck:
    port: 8080
  resources:
    requests:
      memory: '256Mi'
      cpu: '100m'
    limits:
      memory: '512Mi'
      cpu: '500m'
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
