---
embeddedDatabase:
  enabled: true
  crdVersion: '0.26.0'
  clusterVersion: '0.3.1'
  namespace: civitas
  clusterWide: false
  recovery:
    backupName: civitas-database-backups
    clusterName: cloudnative-pg
    database: civitas
    endpointURL: https://minio.civitas.svc.cluster.local:9000
    destinationPath: s3://civitas-database-backups/civitas
    provider: s3
    s3:
      region: us-east-1
      bucket: civitas-database-backups
      path: /
      accessKey: minioadmin
      secretKey: minioadmin
    secret:
      create: true
      name: cloudnative-pg-objectstore-secret
  cluster:
    name: db-cluster
    instances: 3
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
    storage:
      size: 8Gi
      storageClass: ''
    walStorage:
      enabled: false
      size: 1Gi
      storageClass: ''
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    logLevel: info
    env: []
    envFrom: []
    certificates: {}
  backups:
    enabled: false
    endpointURL: https://minio.civitas.svc.cluster.local:9000
    destinationPath: s3://civitas-database-backups/civitas
    s3:
      region: us-east-1
      bucket: civitas-database-backups
      path: /
      accessKey: minioadmin
      secretKey: minioadmin
    secret:
      create: true
      name: cloudnative-pg-backup-objectstore-secret
    wal:
      compression: gzip
      encryption: AES256
      maxParallel: 1
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    scheduledBackups:
      - name: daily-backup
        schedule: '0 2 * * *'
        backupOwnerReference: self
        method: barmanObjectStore
    retentionPolicy: '30d'
