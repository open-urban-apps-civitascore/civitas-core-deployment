---
portal:
  enabled: true
  chartVersion: 0.1.0
  namespace: local-civitas2
  scope: civitas

  # Environment-specific URLs (operators configure these per environment)
  keycloakAuthServerUrl: https://keycloak.127.0.0.1.nip.io
  keycloakRealm: civitas
  ingressDomain: portal.127.0.0.1.nip.io

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    tls:
      secretName: portal-tls

  logLevel: INFO

  backend:
    replicaCount: 1
    image:
      repository: registry.gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/backend-portal
      tag: 0e8d328
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  frontend:
    replicaCount: 1
    image:
      repository: registry.gitlab.com/civitas-connect/civitas-core/civitas-core-v2/civitas-core-platform/frontend-portal
      tag: 90e4047
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Optional: Autoscaling (disabled for local development)
  # autoscaling:
  #   backend:
  #     enabled: false
  #   frontend:
  #     enabled: false
