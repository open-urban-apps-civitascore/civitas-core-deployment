---
# Use private runner (hosted by Frachtwerk @tobias.dillig@frachtwerk.de).
default:
  tags: ['external']

.container-images:
  rules:
    - changes:
        # - container-images/$IMAGE/**/* # TODO: fix the logic to trigger only for the relevant image
        - container-images/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  parallel:
    matrix:
      - IMAGE: etcdctl
      - IMAGE: opa
      - IMAGE: cicd

stages:
  - .pre
  - lint
  - build
  - container-qa
  - publish
  - report
  - deploy

# TODO: Make this work with rennovate
.cicd-image: &cicd_image >-
  registry.gitlab.com/civitas-connect/civitas-core/docker-images/cicd:2.0.0-beta

setup-version:
  image: alpine:latest
  stage: .pre
  rules:
    - when: always
  before_script:
    - apk add --no-cache git
  script:
    - REVISION=$(git describe --tags --always)
    - echo "REVISION=$REVISION" > version.env
    - echo "Setting REVISION=$REVISION"
  artifacts:
    reports:
      # Pass to other jobs
      # https://docs.gitlab.com/ci/yaml/artifacts_reports/#artifactsreportsdotenv
      dotenv: version.env

pre-commit:
  stage: lint
  image: *cicd_image
  script:
    - cp -r defaults/deployment deployment
    - helmfile fetch -f deployment/helmfile.yaml -e default
    - pre-commit run --all-files
  rules:
    - when: always

.deploy-base:
  stage: deploy
  image: *cicd_image
  before_script:
    # Setup kubeconfig
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG=~/.kube/config

    # Verify connectivity
    - kubectl cluster-info
    - kubectl get nodes

    - cp -r .ci/example-deployments deployment

.create-keycloak-smtp-secret: &create-keycloak-smtp-secret
  - |
    set +x
    if [ -z "${SMTP_PASSWORD:-}" ]; then
      echo "WARNING: SMTP_PASSWORD is not set — keycloak-smtp secret will be created with an empty password." >&2
    fi
    # helmfile's createNamespaces runs later, so ensure the namespace exists first.
    kubectl create namespace "${KEYCLOAK_SMTP_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null

    kubectl create secret generic keycloak-smtp \
      --namespace="${KEYCLOAK_SMTP_NAMESPACE}" \
      --from-literal=host='fw-hosting.space' \
      --from-literal=port='587' \
      --from-literal=from='noreply@f9w.de' \
      --from-literal=user='noreply@f9w.de' \
      --from-literal=password="${SMTP_PASSWORD:-}" \
      --dry-run=client -o yaml \
      | kubectl apply -f - >/dev/null
    echo "keycloak-smtp secret ensured in namespace ${KEYCLOAK_SMTP_NAMESPACE}"

deploy-staging:
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_STAGING
    KEYCLOAK_SMTP_NAMESPACE: staging
  script:
    - *create-keycloak-smtp-secret
    - helmfile -f ./deployment/ sync -e staging
  only:
    - staging
  when: manual
  environment:
    name: staging

deploy-production:
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_PRODUCTION
    KEYCLOAK_SMTP_NAMESPACE: civitas
  script:
    - *create-keycloak-smtp-secret
    - helmfile -f ./deployment/ sync -e production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
  environment:
    name: production

# Smoke-test environment
#
# Each pipeline gets its own ephemeral vcluster on the host cluster, keyed by
# a PIPELINE_SLUG value that differs per pipeline type:
#   * Branch pipelines:   PIPELINE_SLUG = $CI_COMMIT_REF_SLUG
#   * MR pipelines:       PIPELINE_SLUG = mr-$CI_MERGE_REQUEST_IID
#
# GitLab tracks the environment as `smoke-test/<slug>` with:
#   * a clickable portal URL in the MR widget,
#   * an auto-stop timer (7d) that triggers the matching destroy job on expiry,
#   * manual `on_stop` so reviewers can tear it down early.

.smoke-test-base:
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    # PIPELINE_SLUG is set by the concrete branch/MR variants below.
    # SMOKE_TEST_BASE_DOMAIN is a CI/CD variable (e.g. `dev.civitas2.fw-web.space`)
    # so we can move off this cluster without code changes.
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    KEYCLOAK_SMTP_NAMESPACE: civitas
  script:
    # 1. Deploy the vcluster on the host cluster and wait for it to be ready.
    - helmfile -f .ci/vcluster/helmfile.yaml.gotmpl sync
    - kubectl -n smoke-test-${PIPELINE_SLUG} rollout status
      deployment/smoke-test-${PIPELINE_SLUG} --timeout=300s

    # 2. Switch kubectl/helm to point at the new vcluster.
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh

    # 3. Bootstrap Linkerd inside the vcluster (idempotent — no-op on re-run).
    - ./scripts/ci/install-linkerd-if-missing.sh

    # 4. Pre-create the keycloak-smtp secret before helmfile syncs keycloak.
    - *create-keycloak-smtp-secret

    # 5. Deploy the platform.
    - helmfile -f ./deployment/ sync -e smoke-test

deploy-smoke-test-branch:
  extends: .smoke-test-base
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  environment:
    name: smoke-test/$CI_COMMIT_REF_SLUG
    url: https://portal.$CI_COMMIT_REF_SLUG.$SMOKE_TEST_BASE_DOMAIN
    on_stop: destroy-smoke-test-branch
    auto_stop_in: 7 days
  rules:
    # Don't double-up on MR pipelines (handled by deploy-smoke-test-mr).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Protected long-lived branches deploy via deploy-staging / deploy-production.

    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: manual

deploy-smoke-test-mr:
  extends: .smoke-test-base
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  environment:
    name: smoke-test/mr-$CI_MERGE_REQUEST_IID
    url: https://portal.mr-$CI_MERGE_REQUEST_IID.$SMOKE_TEST_BASE_DOMAIN
    on_stop: destroy-smoke-test-mr
    auto_stop_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.seed-data-smoke-test-base:
  # Imports baseline platform seed data into the vcluster smoke-test deployment.
  # Runs automatically once the (manually-triggered) deploy job completes.
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    # PIPELINE_SLUG set by the concrete branch/MR variants below.
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    NAMESPACE: civitas
    KEYCLOAK_REALM: civitas
    KEYCLOAK_URL: https://idm.${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    API_BASE_URL: http://apisix-gateway.civitas.svc.cluster.local/v1
    SEED_IMAGE: registry.gitlab.com/civitas-connect/civitas-core/docker-images/seed-platform-data:1.0.0
    SEED_INPUT: exports/1bf03aa3-3d9a-4291-8589-b888aa684c05.json
  script:
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh
    - export AUTH_USER="${GITLAB_USER_EMAIL:-admin@civitas.test}"
    - ./scripts/ci/seed-platform-data.sh

seed-data-smoke-test-branch:
  extends: .seed-data-smoke-test-base
  needs:
    - job: deploy-smoke-test-branch
      artifacts: false
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'

seed-data-smoke-test-mr:
  extends: .seed-data-smoke-test-base
  needs:
    - job: deploy-smoke-test-mr
      artifacts: false
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.destroy-smoke-test-base:
  # Triggered by GitLab when the smoke-test environment is stopped, either
  # manually from the MR widget or automatically by auto_stop_in after 7 days
  # of idleness (no new deploy-smoke-test run in that time).
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
  script:
    # Deleting the host-side namespace also removes the vcluster pod/volumes
    # and everything that was synced into it.
    - kubectl delete namespace smoke-test-${PIPELINE_SLUG} --ignore-not-found
  allow_failure: true

destroy-smoke-test-branch:
  extends: .destroy-smoke-test-base
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  environment:
    name: smoke-test/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: manual

destroy-smoke-test-mr:
  extends: .destroy-smoke-test-base
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  environment:
    name: smoke-test/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

build-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: build
  services:
    - docker:27-dind
  needs:
    - job: setup-version
      artifacts: true
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        --file container-images/$IMAGE/containerfile \
        container-images/$IMAGE/
  after_script:
    - docker buildx rm multiarch || true

scan-container-image:
  extends: .container-images
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: build-container-image
      optional: true
    - job: setup-version
      artifacts: true
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
    - |
      trivy image \
        --scanners vuln \
        --format template \
        --template "@gitlab.tpl" \
        --output gl-container-scanning-report.json \
        $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

publish-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: publish
  needs:
    - job: scan-container-image
      optional: true
    - job: setup-version
      artifacts: true
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/$IMAGE:$REVISION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true

sbom-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: report
  needs:
    - job: publish-container-image
      optional: true
    - job: setup-version
      artifacts: true
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - mkdir -p target
    - syft registry:$CI_REGISTRY_IMAGE/$IMAGE:$REVISION -o cyclonedx-json > target/$IMAGE-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - target/$IMAGE-image.cdx.json
