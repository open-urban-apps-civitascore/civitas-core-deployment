---
# Use private runner (hosted by Frachtwerk @tobias.dillig@frachtwerk.de).
default:
  tags: ['external']

stages:
  - .pre
  - lint
  - deploy
  - system-tests
  - report
  - cleanup

# TODO: Make this work with rennovate
.cicd-image: &cicd_image >-
  registry.gitlab.com/civitas-connect/civitas-core/docker-images/cicd:2.0.0-beta-hotfixes-cicd-image

setup-version:
  image: alpine:latest
  stage: .pre
  rules:
    - when: always
  before_script:
    - apk add --no-cache git
  script:
    - REVISION=$(git describe --tags --always)
    - echo "REVISION=$REVISION" > version.env
    - echo "Setting REVISION=$REVISION"
  artifacts:
    reports:
      # Pass to other jobs
      # https://docs.gitlab.com/ci/yaml/artifacts_reports/#artifactsreportsdotenv
      dotenv: version.env

# Bitnami (and other) charts are served as OCI artifacts from Docker Hub, so
# unauthenticated helmfile fetches count against the Docker Hub rate limit.
# Helm has its own credential store — a plain `docker login` does not help here.
.helm-docker-hub-login: &helm-docker-hub-login
  - |
    if [ -n "$DOCKER_HUB_USER" ] && [ -n "$DOCKER_HUB_TOKEN" ]; then
      echo "$DOCKER_HUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKER_HUB_USER" --password-stdin
    else
      echo "DOCKER_HUB_USER/DOCKER_HUB_TOKEN not set, skipping Docker Hub registry login (unauthenticated chart pulls)"
    fi

pre-commit:
  stage: lint
  image: *cicd_image
  script:
    - *helm-docker-hub-login
    - cp -r defaults/deployment deployment
    - helmfile fetch -f deployment/helmfile.yaml -e default
    - pre-commit run --all-files
  rules:
    - when: always

validate-renovate-config:
  stage: lint
  # Pinned validator version; the gitlabci manager keeps this tag up to date.
  # Ideally keep the major version in sync with the Renovate instance that
  # actually runs against this repo (renovate-integration).
  # https://gitlab.com/civitas-connect/civitas-core/renovate-integration/-/blob/main/.gitlab-ci.yml?ref_type=heads
  image:
    name: ghcr.io/renovatebot/renovate:43.249
    entrypoint: ['']
  needs: []
  rules:
    # Safety net on integration and default branch
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run on MR when renovate config (or this job) changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - renovate.json
        - .gitlab-ci.yml
  script:
    # No file argument on purpose: auto-discovery validates renovate.json as
    # repo config (stricter than the global-config mode used for explicit args)
    - renovate-config-validator --strict

.deploy-base:
  stage: deploy
  image: *cicd_image
  before_script:
    # Setup kubeconfig
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG=~/.kube/config

    # Verify connectivity
    - kubectl cluster-info
    - kubectl get nodes

    - *helm-docker-hub-login

    - cp -r .ci/example-deployments deployment

.create-keycloak-smtp-secret: &create-keycloak-smtp-secret
  - |
    set +x
    if [ -z "${SMTP_PASSWORD:-}" ]; then
      echo "WARNING: SMTP_PASSWORD is not set — keycloak-smtp secret will be created with an empty password." >&2
    fi
    # helmfile's createNamespaces runs later, so ensure the namespace exists first.
    kubectl create namespace "${KEYCLOAK_SMTP_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f - >/dev/null

    kubectl create secret generic keycloak-smtp \
      --namespace="${KEYCLOAK_SMTP_NAMESPACE}" \
      --from-literal=host='fw-hosting.space' \
      --from-literal=port='587' \
      --from-literal=from='noreply@f9w.de' \
      --from-literal=user='noreply@f9w.de' \
      --from-literal=password="${SMTP_PASSWORD:-}" \
      --dry-run=client -o yaml \
      | kubectl apply -f - >/dev/null
    echo "keycloak-smtp secret ensured in namespace ${KEYCLOAK_SMTP_NAMESPACE}"

deploy-staging:
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_STAGING
    KEYCLOAK_SMTP_NAMESPACE: staging
  script:
    - *create-keycloak-smtp-secret
    - helmfile -f ./deployment/ sync -e staging
  only:
    - staging
  when: manual
  environment:
    name: staging

deploy-production:
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_PRODUCTION
    KEYCLOAK_SMTP_NAMESPACE: civitas
  script:
    - *create-keycloak-smtp-secret
    - helmfile -f ./deployment/ sync -e production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
  environment:
    name: production

# Smoke-test environment
#
# Each pipeline gets its own ephemeral vcluster on the host cluster, keyed by
# a PIPELINE_SLUG value that differs per pipeline type:
#   * Branch pipelines:   PIPELINE_SLUG = $CI_COMMIT_REF_SLUG
#   * MR pipelines:       PIPELINE_SLUG = mr-$CI_MERGE_REQUEST_IID
#
# GitLab tracks the environment as `smoke-test/<slug>` with:
#   * a clickable portal URL in the MR widget,
#   * an auto-stop timer (7d) that triggers the matching destroy job on expiry,
#   * manual `on_stop` so reviewers can tear it down early.

.deploy-vcluster-base:
  extends: .deploy-base
  # Smoke-test deploys are convenience environments and must never block mergeability.
  allow_failure: true
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    # PIPELINE_SLUG is set by the concrete branch/MR variants below.
    # SMOKE_TEST_BASE_DOMAIN is a CI/CD variable (e.g. `dev.civitas2.fw-web.space`)
    # so we can move off this cluster without code changes.
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    KEYCLOAK_SMTP_NAMESPACE: civitas
  script:
    # 1. Deploy the vcluster on the host cluster and wait for it to be ready.
    - helmfile -f .ci/vcluster/helmfile.yaml.gotmpl sync
    - kubectl -n smoke-test-${PIPELINE_SLUG} rollout status
      deployment/smoke-test-${PIPELINE_SLUG} --timeout=300s

    # 2. Switch kubectl/helm to point at the new vcluster.
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh

    # 3. Bootstrap Linkerd inside the vcluster (idempotent — no-op on re-run).
    - ./scripts/ci/install-linkerd-if-missing.sh

    # 4. Pre-create the keycloak-smtp secret before helmfile syncs keycloak.
    - *create-keycloak-smtp-secret

    # 5. Deploy the platform.
    - helmfile -f ./deployment/ sync -e smoke-test

deploy-branch:
  extends: .deploy-vcluster-base
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  environment:
    name: smoke-test/$CI_COMMIT_REF_SLUG
    url: https://portal.$CI_COMMIT_REF_SLUG.$SMOKE_TEST_BASE_DOMAIN
    on_stop: destroy-branch
    auto_stop_in: 7 days
  rules:
    # Don't double-up on MR pipelines (handled by deploy-mr).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Protected long-lived branches deploy via deploy-staging / deploy-production.
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: manual

deploy-mr:
  extends: .deploy-vcluster-base
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  environment:
    name: smoke-test/mr-$CI_MERGE_REQUEST_IID
    url: https://portal.mr-$CI_MERGE_REQUEST_IID.$SMOKE_TEST_BASE_DOMAIN
    on_stop: destroy-mr
    auto_stop_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

.seed-base:
  # Imports baseline platform seed data into the vcluster smoke-test deployment.
  # Runs automatically once the (manually-triggered) deploy job completes.
  extends: .deploy-base
  # Seeding belongs to optional smoke-test flow and should not fail the pipeline.
  allow_failure: true
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    # PIPELINE_SLUG set by the concrete branch/MR variants below.
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    NAMESPACE: civitas
    KEYCLOAK_REALM: civitas
    KEYCLOAK_URL: https://idm.${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    API_BASE_URL: http://apisix-gateway.civitas.svc.cluster.local/v1
    SEED_IMAGE: registry.gitlab.com/civitas-connect/civitas-core/docker-images/seed-platform-data:1.0.0
    SEED_INPUT: exports/1bf03aa3-3d9a-4291-8589-b888aa684c05.json
    AUTH_DOTENV_FILE: seed-data-auth.env
  script:
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh
    - export AUTH_USER="${GITLAB_USER_EMAIL:-admin@civitas.test}"
    - ./scripts/ci/seed-platform-data.sh
  artifacts:
    reports:
      dotenv: seed-data-auth.env

.system-tests-base:
  stage: system-tests
  image: *cicd_image
  variables:
    PIPELINE_SLUG: ''
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    API_BASE_URL: https://api.${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}/v1
    KEYCLOAK_URL: https://idm.${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    KEYCLOAK_REALM: civitas
    KEYCLOAK_CLIENT_ID: portal-frontend
    FROST_BASE_URL: http://frost-frost-frost-server-http.frost/FROST-Server/v1.1
  script:
    - bash tests/system/run-system-tests.sh

seed-branch:
  extends: .seed-base
  needs:
    - job: deploy-branch
      artifacts: false
      optional: true
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'

seed-mr:
  extends: .seed-base
  needs:
    - job: deploy-mr
      artifacts: false
      optional: true
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.destroy-vcluster-base:
  # Triggered by GitLab when the smoke-test environment is stopped, either
  # manually from the MR widget or automatically by auto_stop_in after 7 days
  # of idleness (no new deploy run in that time).
  extends: .deploy-base
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
  script:
    # Deleting the host-side namespace also removes the vcluster pod/volumes
    # and everything that was synced into it.
    - kubectl delete namespace smoke-test-${PIPELINE_SLUG} --ignore-not-found
  allow_failure: true

destroy-branch:
  extends: .destroy-vcluster-base
  variables:
    PIPELINE_SLUG: $CI_COMMIT_REF_SLUG
  environment:
    name: smoke-test/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(main|staging|develop)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: manual

destroy-mr:
  extends: .destroy-vcluster-base
  variables:
    PIPELINE_SLUG: mr-$CI_MERGE_REQUEST_IID
  environment:
    name: smoke-test/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

# =============================================================================
# Nightly system tests
#
# Triggered by a GitLab pipeline schedule (Settings -> CI/CD -> Schedules):
#   * Cron: `0 21 * * *` (every day 21:00 / 9pm)
#   * Schedule variable: IS_NIGHTLY = true
#
# Flow (all jobs run automatically — no manual trigger):
#   1. nightly-slug            -> computes PIPELINE_SLUG = nightly-YYYYMMDD and
#                                 NIGHTLY_IMAGE_TAG = <branch>-nightly-YYYYMMDD
#   2. verify-nightly-images   -> hard-fails fast if any image:tag is missing,
#                                 BEFORE any vcluster is provisioned
#   3. deploy-nightly          -> spins up an ephemeral vcluster + deploys platform
#   4. create-demo-db-nightly  -> creates the demo db + user (known password from
#                                 DEMO_DB_PASSWORD) before tests run
#   5. set-initial-user-password-nightly -> sets the initial user's password
#                                 (reusing the seeding logic) and exports the
#                                 credentials as a dotenv for the system tests
#   6. system-tests-nightly    -> runs system tests against the vcluster (NO seed)
#   7. collect-logs-nightly    -> dumps in-cluster pod logs/events as artifacts
#   8. destroy-nightly         -> tears the vcluster down (runs even on failure)

#
# Domain schema: https://portal.nightly-20260629.<SMOKE_TEST_BASE_DOMAIN>
#
# Unlike smoke tests, nightly runs pin a dated nightly build tag
# `<branch>-nightly-YYYYMMDD` via NIGHTLY_IMAGE_TAG.
# =============================================================================

# Compute a per-run date-based slug + image tag shared by all nightly jobs.
# PIPELINE_SLUG is used as a k8s namespace/release suffix and a domain segment,
# so it must be slash-free; the GitLab *environment* name uses nightly/<date>.
nightly-slug:
  stage: .pre
  image: alpine:latest
  variables:
    # Branch whose nightly images we deploy. Override via CI/CD variable.
    NIGHTLY_IMAGE_BRANCH: 'develop'
  rules:
    - if: '$IS_NIGHTLY == "true"'
  script:
    - DATE=$(date +%Y%m%d)
    - echo "PIPELINE_SLUG=nightly-${DATE}" > nightly.env
    - echo "NIGHTLY_IMAGE_TAG=${NIGHTLY_IMAGE_BRANCH}-nightly-${DATE}" >> nightly.env
    - echo "Setting PIPELINE_SLUG=nightly-${DATE}"
    - echo "Setting NIGHTLY_IMAGE_TAG=${NIGHTLY_IMAGE_BRANCH}-nightly-${DATE}"
  artifacts:
    reports:
      dotenv: nightly.env

# Pre-flight: hard-fail fast if any platform image is missing for the requested
# nightly tag, BEFORE we provision a vcluster.
verify-nightly-images:
  stage: .pre
  image: *cicd_image
  needs:
    - job: nightly-slug
      artifacts: true
  # NIGHTLY_IMAGE_TAG is provided via the nightly-slug dotenv artifact.
  rules:
    - if: '$IS_NIGHTLY == "true"'
      when: always
  script:
    - ./scripts/ci/verify-nightly-images.sh

deploy-nightly:
  extends: .deploy-vcluster-base
  allow_failure: false
  needs:
    - job: nightly-slug
      artifacts: true
    # Block the (expensive) vcluster provisioning until images are confirmed.
    - job: verify-nightly-images
      artifacts: false
    - job: pre-commit
      artifacts: false
  environment:
    name: nightly/$CI_COMMIT_REF_SLUG
  rules:
    # Deploy on the nightly schedule (no manual trigger)
    - if: '$IS_NIGHTLY == "true"'
      when: on_success

# Create the demo database + user after deploy, before system tests run.
create-demo-db-nightly:
  extends: .deploy-base
  stage: deploy
  needs:
    - job: nightly-slug
      artifacts: true
    - job: deploy-nightly
      artifacts: false
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    DEMO_DB_PASSWORD: $DEMO_DB_PASSWORD
  rules:
    - if: '$IS_NIGHTLY == "true"'
      when: on_success
  script:
    # Point kubectl/helm at the vcluster the platform was deployed into.
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh
    - ./scripts/ci/create-demo-db.sh smoke-test

# Set the initial user's password after a fresh deploy so the system tests can
# log in.
set-initial-user-password-nightly:
  extends: .deploy-base
  stage: deploy
  needs:
    - job: nightly-slug
      artifacts: true
    - job: deploy-nightly
      artifacts: false
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    NAMESPACE: civitas
    KEYCLOAK_REALM: civitas
    KEYCLOAK_URL: https://idm.${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
    AUTH_DOTENV_FILE: system-test-auth.env
  rules:
    - if: '$IS_NIGHTLY == "true"'
      when: on_success
  script:
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh
    - export AUTH_USER="${GITLAB_USER_EMAIL:-admin@civitas.test}"
    - ./scripts/ci/set-initial-user-password.sh
  artifacts:
    reports:
      dotenv: system-test-auth.env

system-tests-nightly:
  extends: .system-tests-base
  needs:
    - job: nightly-slug
      artifacts: true
    - job: deploy-nightly
      artifacts: false
    - job: create-demo-db-nightly
      artifacts: false
    # Consumes SYSTEM_TEST_AUTH_USER / SYSTEM_TEST_AUTH_PASSWORD dotenv.
    - job: set-initial-user-password-nightly
      artifacts: true
  rules:
    - if: '$IS_NIGHTLY == "true"'
      when: on_success
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tests/system/results/
    reports:
      junit: tests/system/results/xunit.xml

# Collect in-cluster logs/events before the vcluster is destroyed, so failures
# remain debuggable even though the cluster is gone afterwards.
collect-logs-nightly:
  extends: .deploy-base
  stage: report
  needs:
    - job: nightly-slug
      artifacts: true
    - job: system-tests-nightly
      artifacts: false
  variables:
    KUBECONFIG_CONTENT: $KUBECONFIG_CONTENT_VCLUSTER_HOST
    SMOKE_TEST_DOMAIN: ${PIPELINE_SLUG}.${SMOKE_TEST_BASE_DOMAIN}
  rules:
    - if: '$IS_NIGHTLY == "true"'
      when: always
  script:
    # Point kubectl at the vcluster (still alive at this point).
    - ./scripts/ci/fetch-vcluster-kubeconfig.sh
    - mkdir -p nightly-logs
    # Cluster-wide overview.
    - kubectl get all --all-namespaces -o wide > nightly-logs/resources.txt 2>&1 || true
    - kubectl get events --all-namespaces --sort-by=.lastTimestamp > nightly-logs/events.txt 2>&1 || true
    # Per-pod logs (current + previous container) across all namespaces.
    - |
      for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
        for pod in $(kubectl -n "$ns" get pods -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          kubectl -n "$ns" logs "$pod" --all-containers --timestamps \
            > "nightly-logs/${ns}_${pod}.log" 2>&1 || true
          kubectl -n "$ns" logs "$pod" --all-containers --timestamps --previous \
            > "nightly-logs/${ns}_${pod}.previous.log" 2>&1 || true
        done
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - nightly-logs/

destroy-nightly:
  extends: .destroy-vcluster-base
  stage: cleanup
  needs:
    - job: nightly-slug
      artifacts: true
    # Cleanup must always run once a vcluster was provisioned
    - job: deploy-nightly
      artifacts: false
      optional: true
    - job: collect-logs-nightly
      artifacts: false
      optional: true
  rules:
    # Always destroy on the nightly schedule, even if earlier jobs failed.
    - if: '$IS_NIGHTLY == "true"'
      when: always

# Regression tests for kyverno policies themselves (good/bad fixtures per policy).
test-kyverno-policies:
  stage: lint
  image: *cicd_image
  needs: []
  rules:
    - when: always
  script:
    - kyverno test .ci/policies

scan-kyverno-policies:
  stage: lint
  image: *cicd_image
  needs: []
  # Transitional: the production rendering currently has ~49 known findings
  # (rolling-update, resources, ro-rootfs, capabilities, probes, and the
  # explicit-securityContext requirements of the PSS restricted profile).
  # The job reports them as JUnit results without blocking the pipeline.
  # Remove allow_failure once the existing findings are fixed or covered by
  # PolicyExceptions, so new violations block again.
  allow_failure: true
  rules:
    - when: always
  parallel:
    matrix:
      - ENVIRONMENT: local
        POLICIES: .ci/policies/base
      - ENVIRONMENT: production
        POLICIES: .ci/policies/base .ci/policies/production
  script:
    - *helm-docker-hub-login
    - cp -r defaults/deployment deployment
    # Render and scan in separate steps: piping helmfile into kyverno would
    # swallow render failures (kyverno exits 0 on empty input) and turn the
    # job green without a single resource scanned.
    - helmfile template -f deployment/helmfile.yaml -e "$ENVIRONMENT" > rendered.yaml
    - kyverno apply $POLICIES -p --resource rendered.yaml > policy-report.yaml || SCAN_EXIT=$?
    - python3 .ci/policies/report_to_junit.py policy-report.yaml > "kyverno-policy-scan-${ENVIRONMENT}.xml"
    - exit ${SCAN_EXIT:-0}
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: kyverno-policy-scan-*.xml
