---
.container-images:
  rules:
    - changes:
        - container-images/$IMAGE/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  parallel:
    matrix:
      - IMAGE: etcdctl
      - IMAGE: opa

stages:
  - .pre
  - lint
  - build
  - container-qa
  - deploy
  - report

setup-version:
  image: alpine:latest
  stage: .pre
  rules:
    - when: always
  before_script:
    - apk add --no-cache git
  script:
    - REVISION=$(git describe --tags --always)
    - echo "REVISION=$REVISION" > version.env
    - echo "Setting REVISION=$REVISION"
  artifacts:
    reports:
      # Pass to other jobs
      # https://docs.gitlab.com/ci/yaml/artifacts_reports/#artifactsreportsdotenv
      dotenv: version.env

pre-commit:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    # Install system dependencies
    - apt-get update && apt-get install -y git bash gcc libffi-dev python3 python3-pip python3-venv wget

    # Install pre-commit
    - pip3 install --no-cache-dir --break-system-packages pre-commit

    # Install Helm
    - wget -qO- https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar xz
    - mv linux-amd64/helm /usr/local/bin/
    - rm -rf linux-amd64

    # Install Helmfile
    - wget -qO- https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz | tar xz
    - mv helmfile /usr/local/bin/
    - chmod +x /usr/local/bin/helmfile
  script:
    - cp -r defaults/deployment deployment
    - pre-commit run --all-files

deploy:
  stage: deploy
  image: debian:bookworm-slim
  before_script:
    # Install system dependencies
    - apt-get update && apt-get install -y git bash curl wget ca-certificates

    # Install kubectl
    - KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    - kubectl version --client

    # Install Helm
    - wget -qO- https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar xz
    - mv linux-amd64/helm /usr/local/bin/
    - rm -rf linux-amd64
    - helm version

    # Install Helmfile
    - wget -qO- https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz | tar xz
    - mv helmfile /usr/local/bin/
    - chmod +x /usr/local/bin/helmfile
    - helmfile version

    # Setup kubeconfig
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - export KUBECONFIG=~/.kube/config

    # Verify connectivity
    - kubectl cluster-info
    - kubectl get nodes
  script:
    - helmfile -f ./helmfile.d/ sync -e default
  only:
    - main
  when: manual

build-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: build
  services:
    - docker:27-dind
  needs:
    - job: setup-version
      artifacts: true
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: 1
  before_script:
    - docker info
    - docker context create buildx-context
    - docker buildx create --use --driver docker-container --name multiarch buildx-context
    - docker buildx inspect --bootstrap
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - |
      export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --tag $SCAN_IMAGE_TAG \
        --push \
        --file container-images/$IMAGE/containerfile \
        container-images/$IMAGE/
  after_script:
    - docker buildx rm multiarch || true

scan-container-image:
  extends: .container-images
  image:
    name: aquasec/trivy:0.55.1
    entrypoint: ['']
  stage: container-qa
  needs:
    - job: build-container-image
      optional: true
    - job: setup-version
      artifacts: true
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - apk add --no-cache curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/gitlab.tpl -o gitlab.tpl
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
    - |
      trivy image \
        --scanners vuln \
        --format template \
        --template "@gitlab.tpl" \
        --output gl-container-scanning-report.json \
        $SCAN_IMAGE_TAG
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      container_scanning: gl-container-scanning-report.json

deploy-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: deploy
  needs:
    - job: scan-container-image
      optional: true
    - job: setup-version
      artifacts: true
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - export SCAN_IMAGE_TAG=$CI_REGISTRY_IMAGE/$IMAGE:${REVISION}-scan
    - docker buildx imagetools create $SCAN_IMAGE_TAG --tag $CI_REGISTRY_IMAGE/$IMAGE:$REVISION
    - docker buildx imagetools rm $SCAN_IMAGE_TAG || true

sbom-container-image:
  extends: .container-images
  image: docker:27-dind
  stage: report
  needs:
    - job: deploy-container-image
      optional: true
    - job: setup-version
      artifacts: true
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - apk add --no-cache bash curl >/dev/null
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - mkdir -p target
    - syft registry:$CI_REGISTRY_IMAGE/$IMAGE:$REVISION -o cyclonedx-json > target/$IMAGE-image.cdx.json
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - target/$IMAGE-image.cdx.json

scan-kyverno-policies:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    # Install system dependencies
    - apt-get update && apt-get install -y git bash curl wget ca-certificates

    # Install Helm
    - wget -qO- https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar xz
    - mv linux-amd64/helm /usr/local/bin/
    - rm -rf linux-amd64
    - helm version

    # Install Helmfile
    - wget -qO- https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz | tar xz
    - mv helmfile /usr/local/bin/
    - chmod +x /usr/local/bin/helmfile
    - helmfile version

    # Install Kyverno CLI
    - KYVERNO_VERSION=$(curl -sSL https://api.github.com/repos/kyverno/kyverno/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
    - wget -qO- https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz | tar xz
    - mv kyverno /usr/local/bin/
    - kyverno version

    # Install yq for YAML processing
    - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
    - chmod +x /usr/local/bin/yq
    - yq --version
  script:
    - cp -r defaults/deployment deployment
    - helmfile template -f deployment/helmfile.yaml -e local 2>/dev/null | kyverno apply .ci/policies/base .ci/policies/production -p --resource - | .ci/policies/report_to_junit.sh > kyverno-policy-scan.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: kyverno-policy-scan.xml
