---
apiVersion: v1
kind: Secret
metadata:
  name: ca-secret
  namespace: cert-manager
type: Opaque
data:
  tls.crt: ${CA_CERT}
  tls.key: ${CA_KEY}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca
  namespace: cert-manager
spec:
  ca:
    secretName: ca-secret
    crlDistributionPoints:
      - 'http://portal.cert-manager.svc.cluster.local/certs/civitas.crl.pem'
      - 'http://${DOMAIN}/certs/civitas.crl.pem'
      - 'http://kernblick.de/pki/civitas.crl.pem'
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-cert
  namespace: cert-manager
spec:
  secretName: selfsigned-cert-tls
  issuerRef:
    name: selfsigned-ca
    kind: ClusterIssuer
  dnsNames:
    - '*.${DOMAIN}'
